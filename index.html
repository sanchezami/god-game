<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ВОЗВЫШЕННЫЙ: Последний Алтарь</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
    color:#eee;
}

body{
    touch-action:none;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#171b18;
}

/* =========================================================
   WORLD
========================================================= */

#world{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 40%,rgba(255,255,255,.025),transparent 40%),
        #101410;
}

#camera{
    position:absolute;
    width:2600px;
    height:1800px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    will-change:transform;
}

#map{
    position:absolute;
    left:0;
    top:0;
    width:2600px;
    height:1800px;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,rgba(100,150,70,.12),transparent 20%),
        radial-gradient(circle at 80% 70%,rgba(70,110,50,.1),transparent 25%),
        #30462a;
}

/* ground patches */
.ground{
    position:absolute;
    border-radius:50%;
    background:#3d5a31;
    opacity:.8;
}

.ground.g1{left:200px;top:250px;width:900px;height:500px;}
.ground.g2{left:950px;top:150px;width:1100px;height:600px;}
.ground.g3{left:400px;top:850px;width:1300px;height:600px;}
.ground.g4{left:1700px;top:900px;width:700px;height:500px;}

.path{
    position:absolute;
    background:#9a8059;
    opacity:.75;
    border-radius:100px;
    box-shadow:
        inset 0 0 0 5px rgba(70,50,30,.12),
        0 0 15px rgba(0,0,0,.1);
}

.path.main{
    width:2450px;
    height:170px;
    left:70px;
    top:810px;
}

.path.vertical{
    width:150px;
    height:1400px;
    left:1220px;
    top:180px;
}

.path.diagonal{
    width:1150px;
    height:130px;
    left:650px;
    top:510px;
    transform:rotate(28deg);
}

/* water */
#lake{
    position:absolute;
    left:1800px;
    top:170px;
    width:570px;
    height:470px;
    border-radius:48% 52% 55% 45%;
    background:
        radial-gradient(circle at 30% 35%,rgba(255,255,255,.12),transparent 10%),
        radial-gradient(circle at 70% 65%,rgba(255,255,255,.08),transparent 8%),
        #314f62;
    border:14px solid #233b45;
    box-shadow:inset 0 0 35px rgba(0,0,0,.25);
}

.water-line{
    position:absolute;
    height:4px;
    width:100px;
    border-radius:10px;
    background:rgba(255,255,255,.12);
}

/* =========================================================
   OBJECTS
========================================================= */

.object{
    position:absolute;
    user-select:none;
}

.tree{
    width:90px;
    height:120px;
    cursor:pointer;
}

.tree .trunk{
    position:absolute;
    left:38px;
    top:62px;
    width:17px;
    height:52px;
    background:#64432d;
    border-radius:8px;
}

.tree .leaf{
    position:absolute;
    border-radius:50%;
    background:#203e25;
    box-shadow:
        inset -7px -8px 0 rgba(0,0,0,.13),
        0 5px 10px rgba(0,0,0,.2);
}

.tree .a{
    width:65px;
    height:65px;
    left:10px;
    top:10px;
}

.tree .b{
    width:70px;
    height:70px;
    left:28px;
    top:25px;
}

.tree .c{
    width:62px;
    height:62px;
    left:0;
    top:35px;
}

.rock{
    width:70px;
    height:52px;
    cursor:pointer;
}

.rock div{
    position:absolute;
    width:58px;
    height:42px;
    left:5px;
    top:7px;
    background:#747a72;
    border-radius:45% 55% 35% 65%;
    box-shadow:
        inset -9px -8px rgba(0,0,0,.15),
        0 5px 8px rgba(0,0,0,.15);
}

.bush{
    width:85px;
    height:55px;
}

.bush span{
    position:absolute;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#294b2b;
}

.bush span:nth-child(1){left:0;top:10px}
.bush span:nth-child(2){left:25px;top:0}
.bush span:nth-child(3){left:45px;top:12px}

/* =========================================================
   BUILDINGS
========================================================= */

.building{
    position:absolute;
    width:180px;
    height:150px;
    cursor:pointer;
    filter:drop-shadow(0 8px 7px rgba(0,0,0,.22));
}

.building .roof{
    position:absolute;
    left:5px;
    top:10px;
    width:170px;
    height:75px;
    background:#5d3035;
    clip-path:polygon(50% 0,100% 70%,92% 100%,8% 100%,0 70%);
}

.building .body{
    position:absolute;
    left:27px;
    top:65px;
    width:126px;
    height:75px;
    background:#a47c55;
    border:5px solid #62462f;
}

.building .door{
    position:absolute;
    left:72px;
    top:100px;
    width:36px;
    height:40px;
    background:#392b27;
    border-radius:18px 18px 0 0;
}

.building .window{
    position:absolute;
    left:42px;
    top:85px;
    width:25px;
    height:25px;
    background:#9bc2bc;
    border:4px solid #60442e;
}

.building .sign{
    position:absolute;
    left:0;
    top:-35px;
    width:180px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    color:#f0dfb4;
    text-shadow:0 2px 3px #000;
}

.temple{
    width:330px;
    height:310px;
}

.temple .base{
    position:absolute;
    left:30px;
    top:130px;
    width:270px;
    height:145px;
    background:#c0a276;
    border:8px solid #665038;
    border-radius:12px;
}

.temple .roof{
    position:absolute;
    left:15px;
    top:55px;
    width:300px;
    height:120px;
    background:#37283e;
    clip-path:polygon(50% 0,100% 72%,92% 100%,8% 100%,0 72%);
    border-bottom:8px solid #17131c;
}

.temple .door{
    position:absolute;
    left:135px;
    top:185px;
    width:60px;
    height:90px;
    background:#241b25;
    border-radius:30px 30px 0 0;
}

.temple .symbol{
    position:absolute;
    left:142px;
    top:78px;
    width:46px;
    height:46px;
    border:5px solid #d8bc72;
    border-radius:50%;
    box-shadow:0 0 25px rgba(216,188,114,.45);
}

.temple .sign{
    position:absolute;
    top:0;
    width:100%;
    text-align:center;
    color:#f2d98d;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 3px 5px #000;
}

/* houses */
.house{
    width:150px;
    height:130px;
}

.house .roof{
    width:145px;
    height:65px;
    left:3px;
    top:5px;
}

.house .body{
    width:110px;
    height:70px;
    left:20px;
    top:55px;
}

.house .door{
    left:58px;
    top:88px;
}

.house .window{
    left:30px;
    top:76px;
}

/* =========================================================
   RESOURCE NODES
========================================================= */

.resource-node{
    position:absolute;
    width:90px;
    height:90px;
    cursor:pointer;
}

.resource-node .icon{
    position:absolute;
    left:10px;
    top:8px;
    width:70px;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    border-radius:50%;
    background:rgba(20,30,18,.35);
    border:3px solid rgba(255,255,255,.12);
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.resource-node .amount{
    position:absolute;
    left:0;
    bottom:-8px;
    width:90px;
    text-align:center;
    font-size:12px;
    color:#fff;
    text-shadow:0 2px 3px #000;
}

/* =========================================================
   PLAYER
========================================================= */

#player{
    position:absolute;
    width:62px;
    height:82px;
    z-index:1000;
    pointer-events:none;
    transition:transform .08s linear;
}

.player-shadow{
    position:absolute;
    left:7px;
    top:64px;
    width:48px;
    height:15px;
    background:rgba(0,0,0,.32);
    border-radius:50%;
}

.player-body{
    position:absolute;
    left:12px;
    top:23px;
    width:38px;
    height:42px;
    background:#e2d2b5;
    border:4px solid #3b2d28;
    border-radius:16px 16px 13px 13px;
}

.player-head{
    position:absolute;
    left:10px;
    top:4px;
    width:42px;
    height:42px;
    background:#d8b28a;
    border:4px solid #3b2d28;
    border-radius:50%;
}

.player-head:before,
.player-head:after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    background:#211b19;
    border-radius:50%;
    top:15px;
}

.player-head:before{left:8px}
.player-head:after{right:8px}

.horns{
    position:absolute;
    left:9px;
    top:-10px;
    width:44px;
    height:25px;
}

.horns:before,
.horns:after{
    content:"";
    position:absolute;
    width:13px;
    height:23px;
    background:#28202e;
    border:3px solid #17131c;
}

.horns:before{
    left:0;
    transform:rotate(-28deg);
    border-radius:100% 20% 0 0;
}

.horns:after{
    right:0;
    transform:rotate(28deg);
    border-radius:20% 100% 0 0;
}

.player-glow{
    position:absolute;
    left:-5px;
    top:-7px;
    width:72px;
    height:80px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(230,195,100,.15),transparent 65%);
}

/* =========================================================
   VILLAGERS
========================================================= */

.villager{
    position:absolute;
    width:48px;
    height:65px;
    z-index:400;
    cursor:pointer;
}

.villager .body{
    position:absolute;
    left:8px;
    top:22px;
    width:32px;
    height:34px;
    border-radius:12px;
    background:#bd8e66;
    border:3px solid #392b27;
}

.villager .head{
    position:absolute;
    left:9px;
    top:3px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:#d8b28b;
    border:3px solid #392b27;
}

.villager .eye{
    position:absolute;
    width:4px;
    height:4px;
    background:#1e1918;
    border-radius:50%;
    top:13px;
}

.villager .e1{left:7px}
.villager .e2{right:7px}

.villager .name{
    position:absolute;
    top:-17px;
    left:-30px;
    width:108px;
    text-align:center;
    font-size:10px;
    color:#fff;
    text-shadow:0 2px 3px #000;
    pointer-events:none;
}

/* =========================================================
   UI
========================================================= */

#hud{
    position:absolute;
    z-index:5000;
    inset:0;
    pointer-events:none;
}

.panel{
    background:rgba(18,20,19,.90);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 8px 25px rgba(0,0,0,.3);
    backdrop-filter:blur(8px);
    border-radius:12px;
}

#topbar{
    position:absolute;
    left:14px;
    right:14px;
    top:12px;
    min-height:64px;
    padding:9px 12px;
    display:flex;
    align-items:center;
    gap:12px;
    pointer-events:auto;
}

.stat{
    min-width:90px;
}

.stat-name{
    font-size:10px;
    color:#a8aaa6;
    text-transform:uppercase;
}

.stat-value{
    font-size:18px;
    font-weight:bold;
}

.resource{
    display:flex;
    align-items:center;
    gap:6px;
}

#season{
    margin-left:auto;
    text-align:right;
}

#eventText{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    width:min(600px,90%);
    padding:9px 15px;
    text-align:center;
    color:#ead9ad;
    pointer-events:none;
    font-size:13px;
}

#interaction{
    position:absolute;
    left:50%;
    bottom:105px;
    transform:translateX(-50%);
    min-width:240px;
    max-width:90%;
    padding:12px;
    text-align:center;
    pointer-events:auto;
    display:none;
}

#interaction.show{
    display:block;
}

#interactionTitle{
    font-weight:bold;
    margin-bottom:5px;
}

#interactionDesc{
    color:#bbb;
    font-size:12px;
    margin-bottom:9px;
}

button{
    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;
    background:#403a31;
    color:#fff;
    padding:10px 13px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#554b3c;
}

button:active{
    transform:translateY(1px);
}

.primary{
    background:#705c35;
}

.danger{
    background:#633936;
}

#bottom{
    position:absolute;
    left:14px;
    right:14px;
    bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:end;
    pointer-events:none;
}

#controls{
    display:flex;
    gap:7px;
    pointer-events:auto;
}

.control{
    width:48px;
    height:48px;
    padding:0;
    font-size:18px;
}

#hint{
    font-size:11px;
    color:#bbb;
    padding:8px 11px;
    pointer-events:none;
}

/* movement joystick */

#joystick{
    position:absolute;
    left:22px;
    bottom:80px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(15,17,15,.38);
    border:2px solid rgba(255,255,255,.1);
    pointer-events:auto;
    display:none;
}

#stick{
    position:absolute;
    left:35px;
    top:35px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:rgba(220,205,166,.22);
    border:2px solid rgba(255,255,255,.18);
}

@media(max-width:800px){
    #joystick{
        display:block;
    }

    #hint{
        display:none;
    }

    #topbar{
        overflow-x:auto;
        scrollbar-width:none;
    }

    .stat{
        min-width:72px;
    }

    #season{
        min-width:90px;
    }

    #controls{
        margin-left:auto;
    }

    .control{
        width:43px;
        height:43px;
    }
}

/* modal */

#modal{
    position:absolute;
    inset:0;
    z-index:9000;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.68);
    pointer-events:auto;
}

#modal.show{
    display:flex;
}

.modal-card{
    width:min(560px,92%);
    max-height:85%;
    overflow:auto;
    padding:22px;
    border-radius:16px;
    background:#20231f;
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.modal-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}

.modal-text{
    color:#c7c8c4;
    line-height:1.55;
    font-size:14px;
}

.modal-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:18px;
}

/* toast */

#toast{
    position:absolute;
    left:50%;
    top:135px;
    transform:translateX(-50%);
    z-index:10000;
    background:#161816;
    border:1px solid rgba(255,255,255,.15);
    padding:11px 16px;
    border-radius:9px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    box-shadow:0 8px 25px rgba(0,0,0,.4);
}

#toast.show{
    opacity:1;
}

/* day night */
#night{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:3000;
    background:rgba(18,20,50,.0);
    transition:background 1s;
}

body.night #night{
    background:rgba(18,20,60,.42);
}

/* minimap */

#minimap{
    position:absolute;
    right:18px;
    bottom:76px;
    width:155px;
    height:105px;
    border-radius:9px;
    overflow:hidden;
    background:#263822;
    border:2px solid rgba(255,255,255,.15);
    pointer-events:none;
}

.mini-road{
    position:absolute;
    background:#947e5b;
    height:11px;
    width:100%;
    top:47px;
}

.mini-temple{
    position:absolute;
    width:18px;
    height:18px;
    background:#b99a64;
    left:68px;
    top:43px;
}

.mini-player{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#fff;
}

/* health / faith above NPC */

.npc-info{
    position:absolute;
    left:-15px;
    top:-31px;
    width:80px;
    height:5px;
    background:#251e1d;
    border-radius:5px;
    overflow:hidden;
}

.npc-info .bar{
    height:100%;
    background:#8bb36c;
}

/* floating text */

.float{
    position:absolute;
    z-index:7000;
    color:#f4dc96;
    font-weight:bold;
    pointer-events:none;
    animation:floatUp 1s forwards;
    text-shadow:0 2px 4px #000;
}

@keyframes floatUp{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-45px);
    }
}

@media(prefers-reduced-motion:reduce){
    *{
        animation:none!important;
        transition:none!important;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="world">
        <div id="camera">
            <div id="map">

                <div class="ground g1"></div>
                <div class="ground g2"></div>
                <div class="ground g3"></div>
                <div class="ground g4"></div>

                <div class="path main"></div>
                <div class="path vertical"></div>
                <div class="path diagonal"></div>

                <div id="lake">
                    <div class="water-line" style="left:80px;top:120px;"></div>
                    <div class="water-line" style="left:250px;top:250px;"></div>
                    <div class="water-line" style="left:340px;top:180px;"></div>
                </div>

                <!-- OBJECTS -->
                <div id="objects"></div>

                <!-- BUILDINGS -->
                <div class="building temple object"
                     id="temple"
                     style="left:1080px;top:600px;">
                    <div class="sign">ПОСЛЕДНИЙ АЛТАРЬ</div>
                    <div class="roof"></div>
                    <div class="base"></div>
                    <div class="symbol"></div>
                    <div class="door"></div>
                </div>

                <div class="building house object"
                     data-building="house"
                     style="left:580px;top:650px;">
                    <div class="sign">ЖИЛИЩЕ</div>
                    <div class="roof"></div>
                    <div class="body"></div>
                    <div class="window"></div>
                    <div class="door"></div>
                </div>

                <div class="building house object"
                     data-building="house"
                     style="left:1730px;top:690px;">
                    <div class="sign">ЖИЛИЩЕ</div>
                    <div class="roof"></div>
                    <div class="body"></div>
                    <div class="window"></div>
                    <div class="door"></div>
                </div>

                <div class="building house object"
                     data-building="house"
                     style="left:730px;top:1120px;">
                    <div class="sign">ЖИЛИЩЕ</div>
                    <div class="roof"></div>
                    <div class="body"></div>
                    <div class="window"></div>
                    <div class="door"></div>
                </div>

                <div class="building house object"
                     data-building="house"
                     style="left:1630px;top:1130px;">
                    <div class="sign">ЖИЛИЩЕ</div>
                    <div class="roof"></div>
                    <div class="body"></div>
                    <div class="window"></div>
                    <div class="door"></div>
                </div>

                <!-- NPC -->
                <div id="villagers"></div>

                <!-- PLAYER -->
                <div id="player">
                    <div class="player-glow"></div>
                    <div class="player-shadow"></div>
                    <div class="player-head">
                        <div class="horns"></div>
                    </div>
                    <div class="player-body"></div>
                </div>

            </div>
        </div>
    </div>

    <div id="night"></div>

    <!-- HUD -->
    <div id="hud">

        <div id="topbar" class="panel">

            <div class="stat">
                <div class="stat-name">Вера</div>
                <div class="stat-value" id="faith">35</div>
            </div>

            <div class="stat">
                <div class="stat-name">Благосклонность</div>
                <div class="stat-value" id="favor">50</div>
            </div>

            <div class="stat resource">
                <span>🍖</span>
                <b id="food">120</b>
            </div>

            <div class="stat resource">
                <span>🪵</span>
                <b id="wood">80</b>
            </div>

            <div class="stat resource">
                <span>🪨</span>
                <b id="stone">50</b>
            </div>

            <div class="stat resource">
                <span>🪙</span>
                <b id="gold">25</b>
            </div>

            <div id="season">
                <div class="stat-name">Эра</div>
                <b id="time">Весна • День 1</b>

/* =========================================================

/* =========================================================
   HELPERS
========================================================= */

function clamp(value,min,max){
    return Math.max(min,Math.min(max,value));
}

function distance(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function toast(text){
    toastEl.textContent=text;
    toastEl.classList.add("show");

    clearTimeout(toast.timer);

    toast.timer=setTimeout(()=>{
        toastEl.classList.remove("show");
    },1800);
}

function floating(text,x,y){
    const el=document.createElement("div");
    el.className="float";
    el.textContent=text;

    el.style.left=(x-20)+"px";
    el.style.top=(y-20)+"px";

    mapEl.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },1000);
}

function openModal(title,text,buttons=[]){
    modalTitle.textContent=title;
    modalText.innerHTML=text;
    modalActions.innerHTML="";

    buttons.forEach(button=>{
        const b=document.createElement("button");
        b.textContent=button.text;
        b.className=button.className||"";
        b.addEventListener("click",()=>{
            if(button.action) button.action();
        });
        modalActions.appendChild(b);
    });

    modal.classList.add("show");
}

function closeModal(){
    modal.classList.remove("show");
}

function random(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

/* =========================================================
   WORLD GENERATION
========================================================= */

function createTree(x,y){
    const el=document.createElement("div");

    el.className="tree object";

    el.innerHTML=`
        <div class="trunk"></div>
        <div class="leaf a"></div>
        <div class="leaf b"></div>
        <div class="leaf c"></div>
    `;

    el.style.left=x+"px";
    el.style.top=y+"px";

    el.dataset.type="tree";
    el.dataset.x=x;
    el.dataset.y=y;

    el.addEventListener("click",()=>{
        selectObject({
            type:"tree",
            x,
            y,
            element:el
        });
    });

    objectsEl.appendChild(el);

    game.nodes.push({
        type:"tree",
        x,
        y,
        amount:random(3,8),
        element:el,
        active:true
    });
}

function createRock(x,y){
    const el=document.createElement("div");

    el.className="rock object";

    el.innerHTML=`<div></div>`;

    el.style.left=x+"px";
    el.style.top=y+"px";

    el.addEventListener("click",()=>{
        selectObject({
            type:"rock",
            x,
            y,
            element:el
        });
    });

    game.nodes.push({

        y,
        amount:random(2,6),

    const trees=[

    trees.forEach(p=>createTree(p[0],p[1]));

    const bushes=[
        [150,700],[330,600],[470,470],

/* =========================================================
   VILLAGERS
========================================================= */

function renderVillagers(){
    villagersEl.innerHTML="";

    game.villagers.forEach(v=>{
        if(!v.alive) return;

        const el=document.createElement("div");

        el.className="villager";

        el.innerHTML=`
            <div class="name">${v.name}</div>
            <div class="npc-info">
                <div class="bar" style="width:${v.health}%"></div>
            </div>
            <div class="head">
                <div class="eye e1"></div>
                <div class="eye e2"></div>
            </div>
            <div class="body"></div>
        `;

        el.style.left=v.x+"px";
        el.style.top=v.y+"px";

        el.addEventListener("click",()=>{
            selectVillager(v);
        });

        villagersEl.appendChild(el);
    });
}

function selectVillager(v){
    game.selected={
        type:"villager",
        villager:v
    };

    interactionTitle.textContent=v.name+" — "+v.job;

    interactionDesc.textContent=
        `Вера ${v.faith}% • Настроение ${v.happiness}% • Здоровье ${v.health}%`;

    interactionButton.textContent="Поговорить";

    interactionButton.onclick=()=>{
        talkToVillager(v);
    };

    interaction.classList.add("show");
}

function talkToVillager(v){
    const lines=[
        `${v.name}: «Мы всё ещё держимся. Но люди хотят знать, зачем мы здесь.»`,
        `${v.name}: «Алтарь становится сильнее. Я это чувствую.»`,
        `${v.name}: «Сегодня в лесу что-то странное происходит...»`,
        `${v.name}: «Если ты действительно наш бог, не забывай о людях.»`
    ];

    if(v.faith>75){
        lines.push(`${v.name}: «Я верю в тебя. Даже когда остальные сомневаются.»`);
    }

    openModal(
        v.name,
        `<p>${lines[random(0,lines.length-1)]}</p>
         <br>
         <p><b>Вера:</b> ${v.faith}%</p>
         <p><b>Настроение:</b> ${v.happiness}%</p>
         <p><b>Здоровье:</b> ${v.health}%</p>`,
        [
            {
                text:"Благословить",
                className:"primary",
                action:()=>{
                    v.faith=clamp(v.faith+8,0,100);
                    v.happiness=clamp(v.happiness+5,0,100);
                    game.faith+=2;
                    game.stats.villagersHelped++;
                    closeModal();
                    toast("Житель получил благословение.");
                }
            },
            {
                text:"Дать еду",
                action:()=>{
                    if(game.resources.food<5){
                        toast("Не хватает еды.");
                        return;
                    }

                    game.resources.food-=5;
                    v.health=clamp(v.health+12,0,100);
                    v.happiness=clamp(v.happiness+10,0,100);

                    closeModal();
                    toast("Житель накормлен.");
                    updateUI();
                }
            },
            {
                text:"Закрыть",
                action:closeModal
            }
        ]
    );
}

/* =========================================================
   OBJECT INTERACTION
========================================================= */

function selectObject(obj){
    game.selected=obj;

    if(obj.type==="tree"){
        interactionTitle.textContent="Дерево";
        interactionDesc.textContent="Можно получить древесину.";
        interactionButton.textContent="Срубить";
    }

    if(obj.type==="rock"){
        interactionTitle.textContent="Каменная жила";
        interactionDesc.textContent="Можно добыть камень.";
        interactionButton.textContent="Добыть";
    }

    interactionButton.onclick=interactSelected;

    interaction.classList.add("show");
}

function interactSelected(){
    const s=game.selected;

    if(!s) return;

    if(s.type==="tree"){
        const node=game.nodes.find(n=>n.element===s.element);

        if(!node || !node.active) return;

        game.resources.wood+=node.amount;
        game.stats.treesCut++;

        floating("+"+node.amount+" 🪵",node.x,node.y);

        node.active=false;
        node.element.style.opacity="0";
        node.element.style.pointerEvents="none";

        interaction.classList.remove("show");

        toast("Получено "+node.amount+" древесины.");
        updateUI();

        setTimeout(()=>{
            node.amount=random(3,8);
            node.active=true;
            node.element.style.opacity="1";
            node.element.style.pointerEvents="auto";
        },12000);
    }

    if(s.type==="rock"){
        const node=game.nodes.find(n=>n.element===s.element);

        if(!node || !node.active) return;

        game.resources.stone+=node.amount;
        game.stats.rocksMined++;

        floating("+"+node.amount+" 🪨",node.x,node.y);

        node.active=false;
        node.element.style.opacity="0";
        node.element.style.pointerEvents="none";

        interaction.classList.remove("show");

        toast("Получено "+node.amount+" камня.");
        updateUI();

        setTimeout(()=>{
            node.amount=random(2,6);
            node.active=true;
            node.element.style.opacity="1";
            node.element.style.pointerEvents="auto";
        },15000);
    }
}

/* =========================================================
   PLAYER
========================================================= */

function movePlayer(){
    if(game.paused) return;

    let dx=0;
    let dy=0;

    if(keys.left) dx--;
    if(keys.right) dx++;
    if(keys.up) dy--;
    if(keys.down) dy++;

    if(dx!==0 || dy!==0){
        const len=Math.hypot(dx,dy);

        dx/=len;
        dy/=len;

        game.player.x+=dx*game.player.speed;
        game.player.y+=dy*game.player.speed;

        if(dx!==0){
            game.player.direction=dx>0?1:-1;
        }

        interaction.classList.remove("show");
    }

    game.player.x=clamp(game.player.x,30,2500);
    game.player.y=clamp(game.player.y,30,1720);
}

function updatePlayer(){
    playerEl.style.left=(game.player.x-31)+"px";
    playerEl.style.top=(game.player.y-78)+"px";

    playerEl.style.transform=
        `scaleX(${game.player.direction})`;

    const miniX=game.player.x/2600*151;
    const miniY=game.player.y/1800*101;

    miniPlayer.style.left=miniX+"px";
    miniPlayer.style.top=miniY+"px";
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){
    const w=window.innerWidth;
    const h=window.innerHeight;

    let x=game.player.x-w/2;
    let y=game.player.y-h/2;

    x=clamp(x,0,2600-w);
    y=clamp(y,0,1800-h);

    /*
       Центр камеры должен совпадать с центром экрана.
       На маленьких экранах камера остаётся привязана
       к персонажу, поэтому карта ощущается как настоящая.
    */

    cameraEl.style.transform=
        `translate(${-x}px,${-y}px)`;

    game.camera.x=x;
    game.camera.y=y;
}

/* =========================================================
   NPC AI
========================================================= */

function updateVillagers(){
    game.villagers.forEach(v=>{
        if(!v.alive) return;

        const dx=v.targetX-v.x;
        const dy=v.targetY-v.y;
        const d=Math.hypot(dx,dy);

        if(d<5){
            chooseVillagerTarget(v);
            return;
        }

        v.x+=(dx/d)*0.7;
        v.y+=(dy/d)*0.7;
    });

    renderVillagers();
}

function chooseVillagerTarget(v){
    const spots=[
        {x:760,y:760},
        {x:1770,y:770},
        {x:820,y:1250},
        {x:1660,y:1240},
        {x:1250,y:920},
        {x:1250,y:730},
        {x:950,y:850},
        {x:1500,y:850}
    ];

    const target=spots[random(0,spots.length-1)];

    v.targetX=target.x+random(-50,50);
    v.targetY=target.y+random(-50,50);
}

/* =========================================================
   DAY / TURN
========================================================= */

function nextDay(){
    if(game.paused) return;

    game.day++;

    if(game.day>12){
        game.day=1;
        game.season++;

        if(game.season>=4){
            game.season=0;
            game.year++;
            yearEvent();
        }
    }

    const population=game.villagers.filter(v=>v.alive).length;

    const foodCost=Math.max(2,population*3);

    game.resources.food-=foodCost;

    if(game.resources.food<0){
        game.resources.food=0;
        game.villagers.forEach(v=>{
            if(v.alive){
                v.health=clamp(v.health-7,0,100);
                v.happiness=clamp(v.happiness-8,0,100);
            }
        });

        game.faith-=3;

        toast("⚠ Поселению не хватает еды.");
    }else{
        game.villagers.forEach(v=>{
            if(v.alive){
                v.health=clamp(v.health+2,0,100);
                v.happiness=clamp(v.happiness+2,0,100);
            }
        });
    }

    const averageFaith=
        game.villagers.reduce((sum,v)=>sum+(v.alive?v.faith:0),0)/
        Math.max(1,population);

    game.faith+=Math.floor(averageFaith/30)-1;

    if(game.faith>100) game.faith=100;
    if(game.faith<0) game.faith=0;

    game.favor=clamp(
        game.favor+
        (averageFaith>60?1:-1),
        0,
        100
    );

    game.glory+=Math.floor(game.faith/25);

    randomEvent();

    updateTimeOfDay();
    updateUI();
    saveGame(false);
}

function yearEvent(){
    const events=[
        "Новый год начался. Люди ждут знака.",
        "Снега растаяли. В старом лесу обнаружены следы.",
        "На горизонте появились странные огни.",
        "Поселение пережило ещё один год."
    ];

    toast(events[random(0,events.length-1)]);
}

========================================================= */

    const events=[
        eventTraveler,
        eventStrangeStars,
        eventWolves,
        eventHarvest,
        eventDoubt
    ];

    events[random(0,events.length-1)]();
}

         <p>Несколько жителей утверждают,

function eventWolves(){
    game.villagers.forEach(v=>{
        if(v.alive){
            v.health=clamp(v.health-3,0,100);
            v.happiness=clamp(v.happiness-3,0,100);
        }
    });

    game.favor-=2;

    toast("В лесу появились волки.");
}

function eventHarvest(){
    game.resources.food+=random(15,35);
    toast("🌾 Урожай оказался лучше ожиданий.");
}

function eventDoubt(){
    game.faith-=5;

    const candidates=game.villagers.filter(v=>v.alive);

    if(candidates.length){
        const v=candidates[random(0,candidates.length-1)];
        v.faith=clamp(v.faith-12,0,100);
        v.happiness=clamp(v.happiness-8,0,100);
    }

    toast("Некоторые жители начали сомневаться.");
}

/* =========================================================
   MIRACLE / ALTAR
========================================================= */

function pray(){
    if(game.paused) return;

    game.stats.prayers++;

    game.faith+=4;
    game.favor+=2;

    floating("+4 Веры",game.player.x,game.player.y);

    toast("Ты вознёс молитву.");

    updateUI();
}

function miracle(){
    if(game.faith<15){
        toast("Недостаточно веры.");
        return;
    }

    game.faith-=15;
    game.favor+=5;
    game.stats.miracles++;

    game.villagers.forEach(v=>{
        if(v.alive){
            v.faith=clamp(v.faith+5,0,100);
            v.happiness=clamp(v.happiness+7,0,100);
        }
    });

    game.resources.food+=20;
    game.glory+=5;

    floating("✨ ЧУДО",game.player.x,game.player.y);

    toast("Алтарь ответил на молитву.");

    updateUI();
}

========================================================= */

    );
}

function canAfford(cost){
    return Object.entries(cost).every(([key,value])=>{
        return game.resources[key]>=value;
    });
}

function pay(cost){
    Object.entries(cost).forEach(([key,value])=>{
        game.resources[key]-=value;
    });
}

function buildHouse(){
    const cost={wood:25,stone:15};

    if(!canAfford(cost)){
        toast("Недостаточно ресурсов.");
        return;
    }

    pay(cost);

    const positions=[
        [400,760],
        [430,1120],
        [1900,720],
        [1900,1100],
        [1000,1200],
        [1450,1200]
    ];

    const p=positions[game.buildings.length%positions.length];

    const el=document.createElement("div");

    el.className="building house object";

    el.style.left=p[0]+"px";
    el.style.top=p[1]+"px";

    el.innerHTML=`
        <div class="sign">НОВЫЙ ДОМ</div>
        <div class="roof"></div>
        <div class="body"></div>
        <div class="window"></div>
        <div class="door"></div>
    `;

    objectsEl.appendChild(el);

    game.buildings.push({
        type:"house",
        x:p[0],
        y:p[1]
    });

    game.stats.buildingsBuilt++;

    closeModal();

    toast("🏠 Дом построен.");
    updateUI();
}

function buildFarm(){
    const cost={wood:20};

    if(!canAfford(cost)){
        toast("Не хватает древесины.");
        return;
    }

    pay(cost);

    game.resources.food+=35;
    game.stats.buildingsBuilt++;

    closeModal();

    toast("🌾 Поле создано. Урожай собран.");
    updateUI();
}

function buildShrine(){
    const cost={wood:40,stone:30};

    if(!canAfford(cost)){
        toast("Недостаточно ресурсов.");
        return;
    }

    pay(cost);

    game.faith+=10;
    game.favor+=8;
    game.glory+=8;

    game.stats.buildingsBuilt++;

    closeModal();

    toast("🔔 Святилище усилило веру.");
    updateUI();
}

/* =========================================================
   SAVE
========================================================= */

function saveGame(show=true){
    try{
        const data={
            player:{
                x:game.player.x,
                y:game.player.y
            },
            resources:game.resources,
            faith:game.faith,
            favor:game.favor,
            glory:game.glory,
            day:game.day,
            year:game.year,
            season:game.season,
            stats:game.stats,
            villagers:game.villagers.map(v=>({
                id:v.id,
                name:v.name,
                x:v.x,
                y:v.y,
                faith:v.faith,
                happiness:v.happiness,
                health:v.health,
                job:v.job,
                alive:v.alive,
                targetX:v.targetX,
                targetY:v.targetY
            })),
            buildings:game.buildings
        };

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(data)
        );

        if(show) toast("Игра сохранена.");
    }catch(error){
        console.error(error);
        if(show) toast("Не удалось сохранить.");
    }
}

function loadGame(){
    try{
        const raw=localStorage.getItem(SAVE_KEY);

        if(!raw) return false;

        const data=JSON.parse(raw);

        if(data.player){
            game.player.x=Number(data.player.x)||1240;
            game.player.y=Number(data.player.y)||1000;
        }

        if(data.resources){
            game.resources={...game.resources,...data.resources};
        }

        game.faith=Number(data.faith)||35;
        game.favor=Number(data.favor)||50;
        game.glory=Number(data.glory)||0;

        game.day=Number(data.day)||1;
        game.year=Number(data.year)||1;
        game.season=Number(data.season)||0;

        if(data.stats){
            game.stats={...game.stats,...data.stats};
        }

        if(Array.isArray(data.villagers)){
            game.villagers=data.villagers;
        }

        if(Array.isArray(data.buildings)){
            game.buildings=data.buildings;
        }

        restoreBuildings();

        renderVillagers();
        updateUI();

        toast("Сохранение загружено.");

        return true;

    }catch(error){
        console.error(error);
        return false;
    }
}

function restoreBuildings(){
    game.buildings.forEach(b=>{
        const el=document.createElement("div");

        el.className="building house object";

        el.style.left=b.x+"px";
        el.style.top=b.y+"px";

        el.innerHTML=`
            <div class="sign">ДОМ</div>
            <div class="roof"></div>
            <div class="body"></div>
            <div class="window"></div>
            <div class="door"></div>
        `;

        objectsEl.appendChild(el);
    });
}

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener("keydown",e=>{
    if(e.key==="w" || e.key==="ArrowUp") keys.up=true;
    if(e.key==="s" || e.key==="ArrowDown") keys.down=true;
    if(e.key==="a" || e.key==="ArrowLeft") keys.left=true;
    if(e.key==="d" || e.key==="ArrowRight") keys.right=true;

    if(e.key.toLowerCase()==="e"){
        if(game.selected){
            interactSelected();
        }
    }

    if(e.key.toLowerCase()==="p"){
        game.paused=!game.paused;
        toast(game.paused?"Игра поставлена на паузу.":"Игра продолжена.");
    }

    if(e.key.toLowerCase()==="m"){
        openMenu();
    }
});

window.addEventListener("keyup",e=>{
    if(e.key==="w" || e.key==="ArrowUp") keys.up=false;
    if(e.key==="s" || e.key==="ArrowDown") keys.down=false;
    if(e.key==="a" || e.key==="ArrowLeft") keys.left=false;
    if(e.key==="d" || e.key==="ArrowRight") keys.right=false;
});

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickActive=false;

joystick.addEventListener("pointerdown",e=>{
    joystickActive=true;
    joystick.setPointerCapture(e.pointerId);
    updateJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
    if(joystickActive) updateJoystick(e);
});

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

function updateJoystick(e){
    const rect=joystick.getBoundingClientRect();

    const centerX=rect.left+rect.width/2;
    const centerY=rect.top+rect.height/2;

    let dx=e.clientX-centerX;
    let dy=e.clientY-centerY;

    const max=42;

    const len=Math.hypot(dx,dy);

    if(len>max){
        dx=dx/len*max;
        dy=dy/len*max;
    }

    stick.style.left=(35+dx)+"px";
    stick.style.top=(35+dy)+"px";

    keys.left=dx<-10;
    keys.right=dx>10;
    keys.up=dy<-10;
    keys.down=dy>10;
}

function resetJoystick(){
    joystickActive=false;

    stick.style.left="35px";
    stick.style.top="35px";

    keys.left=false;
    keys.right=false;
    keys.up=false;
    keys.down=false;
}

/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=performance.now();
let npcTimer=0;

function loop(now){
    const dt=Math.min(50,now-lastTime);
    lastTime=now;

    if(!game.paused){
        movePlayer();

        npcTimer+=dt;

        if(npcTimer>100){
            npcTimer=0;
            updateVillagers();
        }
    }

    updatePlayer();
    updateCamera();

    requestAnimationFrame(loop);
}

/* =========================================================
   AUTOSAVE
========================================================= */

setInterval(()=>{
    if(!game.paused){
        saveGame(false);
    }
},30000);

/* =========================================================
   INIT
========================================================= */

function init(){
    generateWorld();

    const loaded=loadGame();

    if(!loaded){
        renderVillagers();
        updateUI();
    }

    updateTimeOfDay();
    updatePlayer();
    updateCamera();

    /*
       Каждый новый запуск начинает с живой карты,
       а сохранение восстанавливает прогресс.
    */

    toast(
        loaded
        ? "Добро пожаловать обратно."
        : "Добро пожаловать к Последнему Алтарю."
    );

    requestAnimationFrame(loop);
}

init();
