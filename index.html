html,body{

    height:100%;

button{

#game{

    inset:0;
    width:100%;
    height:100%;
    display:block;

#vignette{

    inset:0;

#top{

.panel{

#stats{

.stat{

.stat small{

.stat strong{

#timeBox{

#timeBox small{

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
    W = innerWidth;
    H = innerHeight;
    canvas.width = Math.floor(W * devicePixelRatio);
    canvas.height = Math.floor(H * devicePixelRatio);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}

addEventListener("resize",resize);
resize();

const TAU = Math.PI * 2;

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
    return a+(b-a)*t;
}

function rand(a=0,b=1){
    return a+Math.random()*(b-a);
}

function irand(a,b){
    return Math.floor(rand(a,b+1));
}

function dist(a,b,c,d){
    return Math.hypot(a-c,b-d);
}

function chance(p){
    return Math.random()<p;
}

function pick(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

/* deterministic noise */

function hash(x,y,seed=1){
    let n = Math.sin(x*127.1+y*311.7+seed*74.3)*43758.5453;
    return n-Math.floor(n);
}

function noise(x,y,scale=1){
    x/=scale;
    y/=scale;

    const x0=Math.floor(x);
    const y0=Math.floor(y);

    const tx=x-x0;
    const ty=y-y0;

    const a=hash(x0,y0,world.seed);
    const b=hash(x0+1,y0,world.seed);
    const c=hash(x0,y0+1,world.seed);
    const d=hash(x0+1,y0+1,world.seed);

    const u=tx*tx*(3-2*tx);
    const v=ty*ty*(3-2*ty);

    return lerp(lerp(a,b,u),lerp(c,d,u),v);
}

function fbm(x,y){
    return (
        noise(x,y,400)*.5+
        noise(x,y,180)*.3+
        noise(x,y,70)*.15+
        noise(x,y,25)*.05
    );
}

function canAfford(cost){
    for(const k in cost){
        if((state[k]||0)<cost[k]) return false;
    }
    return true;
}

function payCost(cost){
    for(const k in cost){
        state[k]-=cost[k];
    }
}

function addQuest(id){
    if(state.quests.some(q=>q.id===id)) return;

    const d=questDatabase[id];

    state.quests.push({
        id,
        step:0,
        completed:false,
        progress:0
    });

    toast("Новое задание",d.title);
}

function questStep(id,step){
    const q=state.quests.find(q=>q.id===id);
    if(!q||q.completed) return;

    q.step=Math.max(q.step,step);

    const d=questDatabase[id];

    if(q.step>=d.steps.length){
        q.completed=true;
        reward(d.reward);

        toast(
            "Задание завершено",
            d.title
        );
    }
}

function reward(r){
    if(r.faith)state.faith+=r.faith;
    if(r.glory)state.glory+=r.glory;
    if(r.xp)addXP(r.xp);

    if(r.gold)state.gold+=r.gold;
    if(r.food)state.food+=r.food;
    if(r.wood)state.wood+=r.wood;
    if(r.stone)state.stone+=r.stone;

    if(r.reputation){
        for(const k in r.reputation){
            state.reputation[k]+=r.reputation[k];
        }
    }
}

function xpNeed(){
    return 100+state.playerLevel*65;
}

function addXP(v){
    state.xp+=v;

    while(state.xp>=xpNeed()){
        state.xp-=xpNeed();
        state.playerLevel++;

        state.maxHealth=(state.maxHealth||100)+5;

        toast(
            "Новый уровень",
            "Уровень "+state.playerLevel
        );
    }
}

function movementInput(){
    let x=0;
    let y=0;

    if(keys.w||keys.arrowup)y--;
    if(keys.s||keys.arrowdown)y++;
    if(keys.a||keys.arrowleft)x--;
    if(keys.d||keys.arrowright)x++;

    if(x||y){
        const l=Math.hypot(x,y);
        return {
            x:x/l,
            y:y/l
        };
    }

    return {x:0,y:0};
}

/* ============================================================
   MOBILE JOYSTICK
============================================================ */

let joy={
    active:false,
    x:0,
    y:0
};

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

function joystickMove(e){
    const r=joystick.getBoundingClientRect();

    const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left-r.width/2;
    const py=(e.touches?e.touches[0].clientY:e.clientY)-r.top-r.height/2;

    const max=44;
    const d=Math.hypot(px,py);

    const k=d>max?max/d:1;

    joy.x=px*k/max;
    joy.y=py*k/max;

    stick.style.transform=
        `translate(${joy.x*35}px,${joy.y*35}px)`;
}

joystick.addEventListener("touchstart",e=>{
    joy.active=true;
    joystickMove(e);
},{passive:true});

joystick.addEventListener("touchmove",e=>{
    if(joy.active)joystickMove(e);
},{passive:true});

addEventListener("touchend",()=>{
    joy.active=false;
    joy.x=0;
    joy.y=0;
    stick.style.transform="";
});

/* ============================================================
   WORLD / REGIONS
============================================================ */

function getRegion(x,y){
    const n=fbm(x,y);

    if(y>4000 && x>4500)return"coast";
    if(x<2200 && y>3000)return"marsh";
    if(x>5000 && y<2100)return"mountain";
    if(x<2700 && y<2200)return"forest";

    if(x<2500 && y<1600)return"ruins";

    return"heartland";
}

function regionName(r){
    return {
        heartland:"Центральная долина",
        forest:"Старый Лес",
        marsh:"Серые Болота",
        mountain:"Каменный Хребет",
        coast:"Северное Побережье",
        ruins:"Разрушенные земли"
    }[r]||r;
}

function terrainColor(r,n){
    if(r==="forest"){
        return `rgb(${Math.floor(35+n*18)},${Math.floor(67+n*30)},${Math.floor(43+n*17)})`;
    }

    if(r==="marsh"){
        return `rgb(${Math.floor(38+n*18)},${Math.floor(53+n*20)},${Math.floor(40+n*15)})`;
    }

    if(r==="mountain"){
        return `rgb(${Math.floor(73+n*30)},${Math.floor(76+n*30)},${Math.floor(82+n*28)})`;
    }

    if(r==="coast"){
        return `rgb(${Math.floor(48+n*25)},${Math.floor(82+n*35)},${Math.floor(73+n*25)})`;
    }

    if(r==="ruins"){
        return `rgb(${Math.floor(61+n*25)},${Math.floor(56+n*22)},${Math.floor(48+n*18)})`;
    }

    return `rgb(${Math.floor(64+n*28)},${Math.floor(83+n*30)},${Math.floor(55+n*20)})`;
}

   CAMERA
============================================================ */

function updateCamera(dt){
    const targetX=player.x-W/(2*camera.zoom);
    const targetY=player.y-H/(2*camera.zoom);

    camera.x=lerp(camera.x,targetX,.08);
    camera.y=lerp(camera.y,targetY,.08);

    camera.x=clamp(
        camera.x,
        0,
        world.width-W/camera.zoom
    );

    camera.y=clamp(
        camera.y,
        0,
        world.height-H/camera.zoom
    );
}

function screenX(x){
    return (x-camera.x)*camera.zoom;
}

function screenY(y){
    return (y-camera.y)*camera.zoom;
}

/* ============================================================
   DRAW TERRAIN
============================================================ */

function drawTerrain(){
    const tile=64;

    const startX=Math.floor(camera.x/tile)-2;
    const endX=Math.ceil((camera.x+W/camera.zoom)/tile)+2;

    const startY=Math.floor(camera.y/tile)-2;
    const endY=Math.ceil((camera.y+H/camera.zoom)/tile)+2;

    for(let ty=startY;ty<=endY;ty++){
        for(let tx=startX;tx<=endX;tx++){

            const wx=tx*tile+tile/2;
            const wy=ty*tile+tile/2;

            if(wx<0||wy<0||wx>world.width||wy>world.height){
                continue;
            }

            const r=getRegion(wx,wy);
            const n=fbm(wx,wy);

            ctx.fillStyle=terrainColor(r,n);

            ctx.fillRect(
                screenX(tx*tile),
                screenY(ty*tile),
                tile*camera.zoom+1,
                tile*camera.zoom+1
            );
        }
    }

    drawWater();
    drawPaths();
    drawTerrainDetails();
}

function drawWater(){
    const lakes=[
        {x:4600,y:2200,rx:520,ry:350},
        {x:5700,y:4300,rx:950,ry:600}
    ];

    for(const l of lakes){
        const x=screenX(l.x);
        const y=screenY(l.y);

        ctx.save();

        ctx.translate(x,y);
        ctx.scale(camera.zoom,camera.zoom);

        const g=ctx.createRadialGradient(
            0,0,50,
            0,0,l.rx
        );

        g.addColorStop(0,"#385e67");
        g.addColorStop(.65,"#294d56");
        g.addColorStop(1,"rgba(27,48,53,.1)");

        ctx.fillStyle=g;

        ctx.beginPath();
        ctx.ellipse(
            0,0,l.rx,l.ry,0,0,TAU
        );
        ctx.fill();

        ctx.strokeStyle="rgba(145,198,202,.14)";
        ctx.lineWidth=2;

        for(let i=0;i<6;i++){
            ctx.beginPath();
            ctx.ellipse(
                0,
                Math.sin(world.time/90+i)*20,
                l.rx*(.25+i*.1),
                l.ry*(.12+i*.045),
                0,0,TAU
            );
            ctx.stroke();
        }

        ctx.restore();
    }
}

function drawPaths(){
    ctx.save();

    ctx.lineCap="round";

    const points=[
        [3600,2600,4600,2200],
        [3600,2600,2350,2100],
        [3600,2600,1650,3800],
        [3600,2600,5900,1150],
        [3600,2600,5800,4200]
    ];

    for(const p of points){
        ctx.strokeStyle="rgba(125,101,68,.38)";
        ctx.lineWidth=85*camera.zoom;

        ctx.beginPath();
        ctx.moveTo(screenX(p[0]),screenY(p[1]));
        ctx.lineTo(screenX(p[2]),screenY(p[3]));
        ctx.stroke();

        ctx.strokeStyle="rgba(166,139,94,.23)";
        ctx.lineWidth=52*camera.zoom;

        ctx.beginPath();
        ctx.moveTo(screenX(p[0]),screenY(p[1]));
        ctx.lineTo(screenX(p[2]),screenY(p[3]));
        ctx.stroke();
    }

    ctx.restore();
}

function drawTerrainDetails(){
    const tile=90;

    const sx=Math.floor(camera.x/tile)-1;
    const ex=Math.ceil((camera.x+W/camera.zoom)/tile)+1;
    const sy=Math.floor(camera.y/tile)-1;
    const ey=Math.ceil((camera.y+H/camera.zoom)/tile)+1;

    for(let y=sy;y<=ey;y++){
        for(let x=sx;x<=ex;x++){

            const wx=x*tile+hash(x,y,22)*tile;
            const wy=y*tile+hash(x,y,44)*tile;

            const r=getRegion(wx,wy);

            if(r==="forest"){
                drawTree(wx,wy,.7+hash(x,y,11)*.7);
            }

            if(r==="mountain"){
                drawRock(wx,wy,.8+hash(x,y,12));
            }

            if(r==="marsh" && hash(x,y,77)>.45){
                drawReed(wx,wy);
            }

            if(r==="heartland" && hash(x,y,91)>.62){
                drawGrass(wx,wy);
            }
        }
    }
}

function drawGrass(x,y,s){
    const sx=screenX(x);
    const sy=screenY(y);

    if(sx<-20||sy<-20||sx>W+20||sy>H+20)return;

    ctx.save();

    ctx.translate(sx,sy);
    ctx.scale(camera.zoom,camera.zoom);

    ctx.strokeStyle="rgba(36,62,40,.55)";
    ctx.lineWidth=1;

    for(let i=0;i<3;i++){
        const ox=(i-1)*4;

        ctx.beginPath();
        ctx.moveTo(ox,5);
        ctx.quadraticCurveTo(
            ox-2,
            -5*s,
            ox+rand(-2,2),
            -9*s
        );
        ctx.stroke();
    }

    ctx.restore();
}

function drawReed(x,y){
    const sx=screenX(x);
    const sy=screenY(y);

    if(sx<-20||sy<-20||sx>W+20||sy>H+20)return;

    ctx.save();
    ctx.translate(sx,sy);
    ctx.scale(camera.zoom,camera.zoom);

    ctx.strokeStyle="rgba(84,105,63,.7)";

    for(let i=0;i<5;i++){
        ctx.beginPath();
        ctx.moveTo((i-2)*3,7);
        ctx.lineTo((i-2)*4,-15-rand(0,7));
        ctx.stroke();
    }

    ctx.restore();
}

/* ============================================================
   TREES / ROCKS
============================================================ */

function drawTree(x,y,s=1){
    const sx=screenX(x);
    const sy=screenY(y);

    if(sx<-80||sy<-100||sx>W+80||sy>H+100)return;

    ctx.save();
    ctx.translate(sx,sy);
    ctx.scale(camera.zoom*s,camera.zoom*s);

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.28)";
    ctx.beginPath();
    ctx.ellipse(3,15,23,8,0,0,TAU);
    ctx.fill();

    /* trunk */

    ctx.fillStyle="#5b4530";
    ctx.beginPath();
    ctx.roundRect(-5,-8,10,25,3);
    ctx.fill();

    /* layered crown */

    const grad=ctx.createRadialGradient(
        -5,-25,2,
        0,-10,30
    );

    grad.addColorStop(0,"#6e9360");
    grad.addColorStop(.5,"#466844");
    grad.addColorStop(1,"#263e2e");

    ctx.fillStyle=grad;

    ctx.beginPath();
    ctx.arc(-10,-18,19,0,TAU);
    ctx.arc(11,-16,20,0,TAU);
    ctx.arc(0,-33,21,0,TAU);
    ctx.fill();

    ctx.fillStyle="rgba(170,195,130,.12)";
    ctx.beginPath();
    ctx.arc(-8,-35,9,0,TAU);
    ctx.fill();

    ctx.restore();
}

function drawRock(x,y,s=1){
    const sx=screenX(x);
    const sy=screenY(y);

    if(sx<-60||sy<-60||sx>W+60||sy>H+60)return;

    ctx.save();

    ctx.translate(sx,sy);
    ctx.scale(camera.zoom*s,camera.zoom*s);

    ctx.fillStyle="rgba(0,0,0,.25)";
    ctx.beginPath();
    ctx.ellipse(4,8,23,9,0,0,TAU);
    ctx.fill();

    const g=ctx.createLinearGradient(-15,-15,15,20);
    g.addColorStop(0,"#a6a6a0");
    g.addColorStop(1,"#55575a");

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.moveTo(-22,8);
    ctx.lineTo(-15,-15);
    ctx.lineTo(3,-23);
    ctx.lineTo(22,-7);
    ctx.lineTo(15,14);
    ctx.lineTo(-8,18);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle="rgba(255,255,255,.12)";
    ctx.beginPath();
    ctx.moveTo(-13,-10);
    ctx.lineTo(3,-17);
    ctx.stroke();

    ctx.restore();
}

/* ============================================================
   BUILDINGS RENDER
============================================================ */

function drawBuilding(b){
    const sx=screenX(b.x);
    const sy=screenY(b.y);

    if(sx<-150||sy<-150||sx>W+150||sy>H+150)return;

    const scale=camera.zoom;

    ctx.save();

    ctx.translate(sx,sy);
    ctx.scale(scale,scale);

    const d=buildingDefs[b.type];

    ctx.fillStyle="rgba(0,0,0,.32)";
    ctx.beginPath();
    ctx.ellipse(5,30,50,16,0,0,TAU);
    ctx.fill();

    if(b.type==="house"){
        drawHouse();
    }else if(b.type==="farm"){
        drawFarm();
    }else if(b.type==="warehouse"){
        drawWarehouse();
    }else if(b.type==="workshop"){
        drawWorkshop();
    }else if(b.type==="forge"){
        drawForge();
    }else if(b.type==="clinic"){
        drawClinic();
    }else if(b.type==="library"){
        drawLibrary();
    }else if(b.type==="market"){
        drawMarket();
    }else if(b.type==="shrine"){
        drawShrine();
    }else if(b.type==="wall"){
        drawWall();
    }

    ctx.restore();
}

function drawHouse(){
    ctx.fillStyle="#685445";
    ctx.fillRect(-42,-15,84,45);

    ctx.fillStyle="#392c28";
    ctx.beginPath();
    ctx.moveTo(-52,-15);
    ctx.lineTo(0,-55);
    ctx.lineTo(52,-15);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#d3a96c";
    ctx.fillRect(-8,3,16,27);

/* ============================================================
   NPC RENDER
============================================================ */

function drawNPC(npc){
    if(!npc.alive)return;

    const sx=screenX(npc.x);
    const sy=screenY(npc.y);

    if(sx<-60||sy<-80||sx>W+60||sy>H+80)return;

    ctx.save();

    ctx.translate(sx,sy);
    ctx.scale(camera.zoom,camera.zoom);

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.27)";
    ctx.beginPath();
    ctx.ellipse(0,13,12,5,0,0,TAU);
    ctx.fill();

    const bob=
        Math.sin(world.time/7+npc.x)*(
            npc.state==="walking"?2:0
        );

    ctx.translate(0,bob);

    /* body */

    const colors=[
        "#6f7797",
        "#8a685c",
        "#687e6d",
        "#92724c",
        "#716486"
    ];

    ctx.fillStyle=colors[Math.floor(npc.color*colors.length)];

    ctx.beginPath();
    ctx.roundRect(-9,-2,18,22,7);
    ctx.fill();

    /* head */

    ctx.fillStyle="#c49b78";

    ctx.beginPath();
    ctx.arc(0,-13,8,0,TAU);
    ctx.fill();

    /* hair */

    ctx.fillStyle="#312a29";

    ctx.beginPath();
    ctx.arc(0,-16,8,Math.PI,TAU);
    ctx.fill();

    /* legs */

    ctx.strokeStyle="#26272c";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.moveTo(-4,19);
    ctx.lineTo(-5,29);
    ctx.moveTo(4,19);
    ctx.lineTo(5,29);
    ctx.stroke();

    /* profession marker */

    if(npc.importance>=4){
        ctx.fillStyle="#d5c47b";
        ctx.beginPath();
        ctx.arc(0,-28,3,0,TAU);
        ctx.fill();
    }

    ctx.restore();
}

/* ============================================================
   PLAYER RENDER
============================================================ */

function drawPlayer(){
    const sx=screenX(player.x);
    const sy=screenY(player.y);

    ctx.save();

    ctx.translate(sx,sy);

    const bob=
        player.moving?
        Math.sin(world.time/5)*2:
        Math.sin(world.time/18)*.5;

    ctx.translate(0,bob);
    ctx.scale(camera.zoom,camera.zoom);

    ctx.fillStyle="rgba(0,0,0,.3)";
    ctx.beginPath();
    ctx.ellipse(0,15,15,6,0,0,TAU);
    ctx.fill();

    /* cloak */

    const g=ctx.createLinearGradient(-12,-2,12,22);
    g.addColorStop(0,"#655b93");
    g.addColorStop(1,"#28253c");

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.moveTo(-12,-2);
    ctx.lineTo(12,-2);
    ctx.lineTo(16,25);
    ctx.lineTo(-16,25);
    ctx.closePath();
    ctx.fill();

    /* head */

    ctx.fillStyle="#c99f7b";

    ctx.beginPath();
    ctx.arc(0,-12,10,0,TAU);
    ctx.fill();

    /* horns */

    ctx.fillStyle="#e0d3b5";

    ctx.beginPath();
    ctx.moveTo(-6,-19);
    ctx.quadraticCurveTo(-17,-34,-11,-40);
    ctx.quadraticCurveTo(-6,-30,-2,-22);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(6,-19);
    ctx.quadraticCurveTo(17,-34,11,-40);
    ctx.quadraticCurveTo(6,-30,2,-22);
    ctx.closePath();
    ctx.fill();

    /* eyes */

    ctx.fillStyle="#b9b1ff";

    ctx.beginPath();
    ctx.arc(-4,-13,1.5,0,TAU);
    ctx.arc(4,-13,1.5,0,TAU);
    ctx.fill();

    /* aura */

    const aura=ctx.createRadialGradient(
        0,0,3,
        0,0,40
    );

    aura.addColorStop(0,"rgba(153,146,255,.15)");
    aura.addColorStop(1,"rgba(153,146,255,0)");

    ctx.fillStyle=aura;
    ctx.beginPath();
    ctx.arc(0,0,40,0,TAU);
    ctx.fill();

    ctx.restore();
}

/* ============================================================
   PARTICLES
============================================================ */

function particle(x,y,color,type="spark"){
    particles.push({
        x,
        y,
        vx:rand(-25,25),
        vy:rand(-55,-10),
        life:rand(.35,.9),
        maxLife:1,
        size:rand(2,5),
        color,
        type
    });
}

function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];

        p.life-=dt;

        if(p.life<=0){
            particles.splice(i,1);
            continue;
        }

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vy+=55*dt;
    }
}

function drawParticles(){
    for(const p of particles){
        const a=clamp(p.life/p.maxLife,0,1);

        ctx.globalAlpha=a;

        ctx.fillStyle=p.color;

        ctx.beginPath();
        ctx.arc(
            screenX(p.x),
            screenY(p.y),
            p.size*camera.zoom,
            0,
            TAU
        );
        ctx.fill();
    }

    ctx.globalAlpha=1;
}

/* ============================================================
   FLOATING TEXT
============================================================ */

function floatText(x,y,text){
    floatingTexts.push({
        x,
        y,
        text,
        life:1,
        max:1
    });
}

function updateFloating(dt){
    for(let i=floatingTexts.length-1;i>=0;i--){
        const f=floatingTexts[i];

        f.life-=dt;
        f.y-=25*dt;

        if(f.life<=0){
            floatingTexts.splice(i,1);
        }
    }
}

function drawFloating(){
    for(const f of floatingTexts){
        ctx.globalAlpha=f.life;

        ctx.font="bold 14px system-ui";
        ctx.textAlign="center";
        ctx.fillStyle="#ffffff";

        ctx.fillText(
            f.text,
            screenX(f.x),
            screenY(f.y)
        );
    }

    ctx.globalAlpha=1;
}

function updateWeather(dt){
    world.weatherTimer-=dt;

    if(world.weatherTimer<=0){
        world.weatherTimer=rand(500,900);

        const old=world.weather;

        const list=[
            "clear",
            "clear",
            "cloudy",
            "rain",
            "clear",

        ];

        world.weather=pick(list);

        if(old!==world.weather){

                weatherName(world.weather)
            );
        }

function weatherName(w){
    return {
        clear:"Ясно",
        cloudy:"Облачно",
        rain:"Дождь",
        fog:"Туман"
    }[w];
}

function drawWeather(){
    if(world.weather==="rain"){
        ctx.strokeStyle="rgba(170,200,220,.16)";
        ctx.lineWidth=1;

        for(let i=0;i<150;i++){
            const x=(i*97+world.time*80)%W;

        g.addColorStop(1,"rgba(200,210,205,.20)");

        ctx.fillStyle=g;
        ctx.fillRect(0,0,W,H);
    }
}

/* ============================================================
   DAY / NIGHT
============================================================ */

function nightAlpha(){
    const t=world.time%1440;

    if(t<300)return .46;
    if(t<450)return lerp(.46,0,(t-300)/150);
    if(t<1080)return 0;
    if(t<1260)return lerp(0,.42,(t-1080)/180);

    return .42;
}

function drawLighting(){
    const a=nightAlpha();

    if(a<=0)return;

    ctx.fillStyle=`rgba(5,8,20,${a})`;
    ctx.fillRect(0,0,W,H);

    /* moon glow around player */

    const px=screenX(player.x);
    const py=screenY(player.y);

    const g=ctx.createRadialGradient(
        px,py,40,
        px,py,260
    );

    g.addColorStop(0,"rgba(150,160,220,.10)");
    g.addColorStop(1,"rgba(150,160,220,0)");

    ctx.fillStyle=g;
    ctx.fillRect(
        px-300,
        py-300,
        600,
        600
    );
}

/* ============================================================
   NPC AI
============================================================ */

function updateNPCs(dt){

    for(const npc of npcs){

        if(!npc.alive)continue;

        npc.talkCooldown=Math.max(
            0,
            npc.talkCooldown-dt
        );

        npc.hunger+=dt*.7;
        npc.energy-=dt*.08;

        if(npc.hunger>75){
            npc.mood-=dt*.05;
        }

        if(npc.energy<15){
            npc.state="resting";
        }

        const hour=(world.time%1440)/60;

        /* schedules */

        if(hour>=6&&hour<9){
            npc.state="morning";
            npc.targetX=npc.homeX;
            npc.targetY=npc.homeY;
        }
        else if(hour>=9&&hour<17){
            npc.state="working";
            assignNPCWork(npc);
        }
        else if(hour>=17&&hour<21){
            npc.state="social";
            npc.targetX=npc.homeX+rand(-100,100);
            npc.targetY=npc.homeY+rand(-100,100);
        }
        else{
            npc.state="resting";
            npc.targetX=npc.homeX;
            npc.targetY=npc.homeY;
        }

        /* rare autonomous thoughts */

        if(chance(dt*.002)){
            npc.memory.push({
                type:"world",
                text:"Сегодня мир изменился.",
                time:world.day
            });

            if(npc.personality==="любопытный"){
                state.knowledge+=.05;
            }
        }

        moveNPC(npc,dt);

        /* natural recovery */

        if(npc.state==="resting"){
            npc.energy=clamp(
                npc.energy+dt*3,
                0,
                100
            );
        }

        if(npc.hunger>100){
            npc.hunger=100;
        }

        npc.mood=clamp(npc.mood,0,100);
        npc.trust=clamp(npc.trust,0,100);
        npc.respect=clamp(npc.respect,0,100);
    }
}

function assignNPCWork(npc){

    switch(npc.profession){

        case"фермер":
            npc.targetX=3800+rand(-220,220);
            npc.targetY=2800+rand(-150,150);
            break;

            break;

        case"каменщик":
            npc.targetX=3300+rand(-400,400);
            npc.targetY=3100+rand(-400,400);
            break;

        case"торговец":
            npc.targetX=4050;
            npc.targetY=2500;
            break;

        case"охотник":
            npc.targetX=2850+rand(-700,700);
            npc.targetY=2800+rand(-600,600);
            break;

        case"рыбак":
            npc.targetX=4500;
            npc.targetY=2200;
            break;

        case"учёный":
            npc.targetX=3900;
            npc.targetY=2350;
            break;

function moveNPC(npc,dt){

    const dx=npc.targetX-npc.x;
    const dy=npc.targetY-npc.y;
    const d=Math.hypot(dx,dy);

    if(d>30){
        npc.x+=dx/d*35*dt;
        npc.y+=dy/d*35*dt;
    }
}

/* ============================================================
   RESOURCE INTERACTION
============================================================ */

function nearestObject(range=90){
    let best=null;
    let bd=range;

    for(const o of objects){

        if(o.hp<=0)continue;

        const d=dist(
            player.x,
            player.y,
            o.x,
            o.y
        );

        if(d<bd){
            bd=d;
            best=o;
        }
    }

    return best;
}

function nearestNPC(range=100){
    let best=null;
    let bd=range;

    for(const npc of npcs){

        if(!npc.alive)continue;

        const d=dist(
            player.x,
            player.y,
            npc.x,
            npc.y
        );

        if(d<bd){
            bd=d;
            best=npc;
        }
    }

    return best;
}

function nearestBuilding(range=100){
    let best=null;
    let bd=range;

    for(const b of buildings){

        const d=dist(
            player.x,
            player.y,
            b.x,
            b.y
        );

        if(d<bd){
            bd=d;
            best=b;
        }
    }

    return best;
}

function performInteract(){

    if(player.interactCooldown>0)return;

    player.interactCooldown=.3;

    const npc=nearestNPC();

    if(npc){
        talkTo(npc);
        return;
    }

    const obj=nearestObject();

    if(obj){
        gather(obj);
        return;
    }

    const b=nearestBuilding();

    if(b){
        useBuilding(b);
        return;
    }

    toast(
        "Ничего",
        "Здесь нечего делать."
    );
}

function gather(o){

    let amount=1;

    if(o.type==="tree"){
        amount=irand(3,7);
        state.wood+=amount;
        floatText(o.x,o.y-25,"+"+amount+" дерева");
    }

    if(o.type==="rock"){
        amount=irand(2,5);
        state.stone+=amount;
        floatText(o.x,o.y-25,"+"+amount+" камня");
    }

    if(o.type==="herb"){
        amount=irand(1,3);
        state.herbs+=amount;
        floatText(o.x,o.y-25,"+"+amount+" трав");
    }

    if(o.type==="ore"){
        amount=irand(1,2);
        state.iron+=amount;
        floatText(o.x,o.y-25,"+"+amount+" железа");
    }

    for(let i=0;i<5;i++){
        particle(
            o.x,
            o.y,
            "#d5c38b"
        );
    }

    o.hp=0;
    o.respawn=rand(60,180);

    if(o.type==="tree"){
        addXP(4);
    }else{
        addXP(3);
    }

    updateUI();
}

/* ============================================================
   BUILDING USE
============================================================ */

function useBuilding(b){

    if(b.type==="shrine"){
        divinePrayer();
        return;
    }

    if(b.type==="farm"){
        harvestFarm();
        return;
    }

    if(
        b.type==="workshop"||
        b.type==="forge"
    ){
        openPanel("craft");
        return;
    }

    if(b.type==="market"){
        openPanel("market");
        return;
    }

    if(b.type==="library"){
        state.knowledge+=1;
        state.mystery+=1;

        toast(
            "Исследование",
            "Вы изучили старые записи."
        );

        updateUI();
        return;
    }

    toast(
        buildingDefs[b.type].name,
        "Здание работает в поселении."
    );
}

/* ============================================================
   FARM
============================================================ */

function harvestFarm(){

    let harvested=0;

    for(const c of crops){

        if(c.growth>=1){

            c.growth=0;
            c.watered=false;

            harvested+=irand(2,5);
        }
    }

    if(harvested>0){
        state.food+=harvested;

        state.prosperity+=2;

        toast(
            "Урожай",
            "Получено еды: "+harvested
        );
    }else{
        toast(
            "Ферма",
            "Урожай ещё не созрел."
        );
    }

    updateUI();
}

============================================================ */

function divinePrayer(){

    if(state.faith<5){
        toast(
            "Недостаточно веры",
            "Поселению не хватает веры."
        );
        return;
    }

    state.faith-=5;
    state.glory+=2;

    const power=state.mercy+state.wrath+state.mystery;

    if(power<8){
        state.mercy++;
        toast(
            "Молитва услышана",
            "В алтаре появилась слабая искра."
        );
    }else{
        toast(
            "Молитва услышана",
            "Божественная сила откликнулась."
        );
    }

    updateUI();
}

function useDivinePower(){

    if(state.faith<10){
        toast(
            "Слишком мало веры",
            "Для чуда требуется 10 веры."
        );
        return;
    }

    openDivinityChoice();
}

                        );
                    }

                    toast(

                        "Небо ответило на зов."

function buyDivinity(path){

    const costs={
        mercy:5,
        wrath:5,
        mystery:5
    };

    if(state.faith<costs[path]){
        toast(
            "Недостаточно веры",
            "Нужно "+costs[path]+" веры."
        );
        return;
    }

    state.faith-=costs[path];

    if(path==="mercy"){
        state.mercyPath++;
        state.mercy+=2;
        state.morale+=4;
    }

    if(path==="wrath"){
        state.wrathPath++;
        state.wrath+=2;
        state.security+=4;
    }

    if(path==="mystery"){
        state.mysteryPath++;
        state.mystery+=2;
        state.knowledge+=2;
    }

    addXP(20);

    toast(
        "Божественное развитие",
        "Сила "+path+" стала глубже."
    );

    updateUI();
}

   NPC DIALOGUE
============================================================ */

function talkTo(npc){

    if(npc.talkCooldown>0)return;

    npc.talkCooldown=5;

    let text="";

    if(npc.trust<25){
        text="Я пока не уверен, что могу тебе доверять.";
    }else if(npc.mood<25){
        text="Сегодня всё идёт не так.";
    }else if(npc.personality==="любопытный"){
        text="Мне кажется, за пределами долины скрыто нечто важное.";
    }else if(npc.personality==="амбициозный"){
        text="Если поселение станет сильнее, я хочу увидеть, насколько далеко мы сможем зайти.";
    }else{
        text="Рад видеть тебя. Как идут дела?";
    }

    const choices=[];

    choices.push({
        text:"Спросить о жизни поселения",
        fn(){
            const effect=
                Math.floor(
                    (state.morale+
                    state.prosperity+
                    state.security)/3
                );

            openDialogue(
                npc.name,
                "Сейчас дела у нас на "+effect+"%. " +
                "Я работаю как "+npc.profession+
                ". Если всё пойдёт хорошо, поселение будет расти.",
                [
                    {
                        text:"Поблагодарить",
                        fn(){
                            npc.trust+=4;
                            npc.mood+=3;

                            remember(
                                npc,
                                "Игрок проявил уважение."
                            );

                            closeDialogue();
                        }
                    },
                    {
                        text:"Требовать работать лучше",
                        fn(){
                            npc.respect+=2;
                            npc.trust-=5;
                            npc.mood-=8;

                            remember(
                                npc,
                                "Игрок оказал давление."
                            );

                            closeDialogue();

                            toast(
                                "Последствия",
                                npc.name+" запомнит этот разговор."
                            );
                        }
                    }
                ]
            );
        }
    });

    choices.push({
        text:"Попросить о личном мнении",
        fn(){

            let opinion;

            if(state.mercy>state.wrath){
                opinion=
                    "Люди говорят, что ты стал мягче. " +
                    "Некоторым это нравится, другим кажется слабостью.";
            }
            else if(state.wrath>state.mercy){
                opinion=
                    "После последних решений жители стали осторожнее рядом с тобой.";
            }
            else{
                opinion=
                    "Пока никто не понимает, каким правителем ты хочешь стать.";
            }

            openDialogue(
                npc.name,
                opinion,
                [
                    {
                        text:"Понять",
                        fn(){
                            npc.trust+=2;
                            closeDialogue();
                        }
                    }
                ]
            );
        }
    });

    if(npc.profession==="торговец"){

        choices.push({
            text:"Обсудить торговлю",
            fn(){
                state.reputation.merchants+=2;

                if(state.reputation.merchants>=10){
                    state.flags.merchantContact=true;
                    addQuest("merchant");
                }

                openDialogue(
                    npc.name,
                    "Если ты хочешь караваны, нам нужны безопасность и запас ресурсов.",
                    [
                        {
                            text:"Я займусь этим.",
                            fn(){
                                npc.trust+=5;
                                closeDialogue();
                            }
                        }
                    ]
                );
            }
        });
    }

    openDialogue(
        npc.name,
        text,
        choices
    );
}

function remember(npc,text){

    npc.memory.push({
        day:world.day,
        text
    });

    if(npc.memory.length>20){
        npc.memory.shift();
    }
}

function openDialogue(name,text,choices){

    document.getElementById("dialogueName").textContent=name;
    document.getElementById("dialogueText").textContent=text;

    const box=
        document.getElementById("dialogueChoices");

    box.innerHTML="";

    for(const c of choices){

        b.className="choice";
        b.textContent=c.text;

        b.onclick=c.fn;

        box.appendChild(b);
    }

        .classList.add("show");
}

const eventState={

function updateEvents(dt){

    if(eventState.active){

        eventState.timer-=dt;

        if(eventState.timer<=0){
            resolveEvent(eventState.active);
            eventState.active=null;
        }

        return;
    }

    if(chance(dt/1200)){
        startEvent(
            pick(eventPool)
        );
    }
}

   MARKET
============================================================ */

const marketPrices={
    food:2,
    wood:1,
    stone:1,
    iron:4,
    herbs:3,
    crystal:15
};

function dynamicPrice(item){

    let p=marketPrices[item]||1;

    const supply={
        food:state.food,
        wood:state.wood,
        stone:state.stone,
        iron:state.iron,
        herbs:state.herbs,
        crystal:state.crystal
    }[item]||0;

    if(supply<20)p*=1.8;
    if(supply>100)p*=.65;

    if(state.prosperity>70)p*=1.15;

    return Math.max(1,Math.round(p));
}

function buyMarket(item){

    const p=dynamicPrice(item);

    if(state.gold<p){
        toast(
            "Недостаточно золота",
            "Цена: "+p
        );
        return;
    }

    state.gold-=p;
    state[item]+=1;

    state.reputation.merchants+=.2;

    updateUI();
}

function sellMarket(item){

    if(state[item]<=0){
        toast(
            "Нет ресурса",
            "Нечего продавать."
        );
        return;
    }

    const p=dynamicPrice(item);

    state[item]-=1;
    state.gold+=Math.max(1,Math.floor(p*.7));

    state.reputation.merchants+=.1;

    updateUI();
}

            r.name
        );

/* ============================================================
   COMBAT
============================================================ */

function attack(){

    if(player.attackTimer>0)return;

    player.attackTimer=.45;

    const range=85;

    let hit=false;

    for(const e of enemies){

        if(e.hp<=0)continue;

        const d=dist(
            player.x,
            player.y,
            e.x,
            e.y
        );

        if(d<range){

            const type=enemyTypes[e.type];

            let damage=
                12+
                state.playerLevel*2+
                state.wrathPath*2;

            e.hp-=damage;

            hit=true;

            floatText(
                e.x,
                e.y-30,
                "-"+damage
            );

            for(let i=0;i<8;i++){
                particle(
                    e.x,
                    e.y,
                    "#c3bfff"
                );
            }

            if(e.hp<=0){

                addXP(type.xp);

                state.gold+=
                    irand(2,8);

                state.wrath+=
                    e.type==="corrupted"?1:0;

                toast(
                    "Победа",
                    type.name+" побеждён."
                );
            }
        }
    }

    if(!hit){
        for(let i=0;i<4;i++){
            particle(
                player.x+Math.cos(player.facing)*30,
                player.y+Math.sin(player.facing)*30,
                "#aaa5ff"
            );
        }
    }
}

addEventListener("mousedown",e=>{
    if(e.button===0){
        attack();
    }
});

/* ============================================================
   ENEMY AI
============================================================ */

function updateEnemies(dt){

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        if(e.hp<=0){
            enemies.splice(i,1);
            continue;
        }

        const d=dist(
            e.x,
            e.y,
            player.x,
            player.y
        );

        const type=enemyTypes[e.type];

        e.attackCooldown-=dt;

        if(d<330){

            const dx=player.x-e.x;
            const dy=player.y-e.y;
            const l=Math.hypot(dx,dy)||1;

            if(d>55){

                e.x+=dx/l*type.speed*dt;
                e.y+=dy/l*type.speed*dt;

            }else if(e.attackCooldown<=0){

                e.attackCooldown=1.4;

                state.health=
                    (state.health??100)-
                    type.damage;

                toast(
                    "Опасность",
                    type.name+" атакует!"
                );

                if((state.health??100)<=0){
                    state.health=100;

                    player.x=3600;
                    player.y=2600;

                    state.gold=Math.max(
                        0,
                        state.gold-10
                    );

                    toast(
                        "Возвращение",
                        "Ты потерял часть золота."
                    );
                }
            }
        }
        else{
            e.wander+=dt*.3;

            e.x+=Math.cos(e.wander)*8*dt;
            e.y+=Math.sin(e.wander)*8*dt;
        }
    }
}

/* ============================================================
   TIME / SIMULATION
============================================================ */

let dayAccumulator=0;

function updateTime(dt){

    world.time+=dt*4;

    if(world.time>=1440){

        world.time-=1440;

        world.day++;

        dayStart();

        if(world.day%28===0){
            world.season++;

            if(world.season>=4){
                world.season=0;
                world.year++;
            }
        }
    }
}

function dayStart(){

    /* food consumption */

    const need=
        Math.ceil(state.population*.65);

    state.food-=need;

    if(state.food<0){

        state.food=0;

        state.morale-=8;
        state.faith-=3;

        for(const npc of npcs){
            npc.hunger+=20;
            npc.mood-=10;
        }

        toast(
            "Нехватка еды",
            "Жители начинают голодать."
        );

    }else{

        state.morale+=1;
        state.prosperity+=.5;
    }

    /* buildings */

    for(const b of buildings){

        const d=buildingDefs[b.type];

        if(d.food){
            state.food+=d.food*b.level;
        }

        if(d.knowledge){
            state.knowledge+=d.knowledge*.1;
        }

        if(d.faith){
            state.faith+=d.faith*.2;
        }

        if(d.economy){
            state.prosperity+=d.economy*.1;
        }

        if(d.health){
            for(const n of npcs){
                n.health=clamp(
                    n.health+d.health*.2,
                    0,
                    100
                );
            }
        }
    }

    /* crop growth */

    for(const c of crops){

        const growth=
            world.season===3?.012:.025;

        c.growth+=growth;

        c.growth=clamp(c.growth,0,1);
    }

    /* NPC memories */

    for(const npc of npcs){

        if(npc.mood>70){
            npc.trust+=.2;
        }

        if(npc.hunger>80){
            npc.trust-=.4;
        }

        npc.mood=clamp(npc.mood,0,100);
    }

    state.morale=clamp(state.morale,0,100);
    state.security=clamp(state.security,0,100);
    state.prosperity=clamp(state.prosperity,0,100);
    state.faith=Math.max(0,state.faith);

    checkStory();

    saveGame();

    toast(
        "Новый день",
        seasons[world.season]+" • День "+world.day
    );
}

function checkStory(){

    if(
        state.storyChapter===1 &&
        state.faith>=50
    ){
        state.storyChapter=2;

        state.discovered.forest=true;

        addQuest("forest");

        toast(
            "Глава II",
            "Шёпот Старого Леса"
        );
    }

    if(
        state.storyChapter===2 &&
        state.mystery>=20 &&
        state.discovered.ruins
    ){
        state.storyChapter=3;

        toast(
            "Глава III",
            "Под камнем"
        );
    }

    if(
        state.storyChapter===3 &&
        state.knowledge>=30
    ){
        state.storyChapter=4;

        toast(
            "Глава IV",
            "То, что было забыто"
        );
    }

    checkEndings();
}

function checkEndings(){

    if(state.flags.ending)return;

    const days=world.day;

    if(
        days>180 &&
        state.mercy>=50 &&
        state.morale>75 &&
        state.prosperity>70
    ){
        state.flags.ending="mercy";
    }

    if(
        days>180 &&
        state.wrath>=50 &&
        state.security>80
    ){
        state.flags.ending="wrath";
    }

    if(
        days>180 &&
        state.mystery>=60 &&
        state.knowledge>70
    ){
        state.flags.ending="mystery";
    }
}

/* ============================================================
   SAVE / LOAD
============================================================ */

const SAVE_KEY="elevated_last_altar_v5";

function saveGame(){

    const data={
        world:{
            seed:world.seed,
            time:world.time,
            day:world.day,
            year:world.year,
            season:world.season,
            weather:world.weather,
            weatherTimer:world.weatherTimer
        },

        state,

        player:{
            x:player.x,
            y:player.y,
            stamina:player.stamina
        },

        npcs:npcs.map(n=>({
            ...n
        })),

        buildings:buildings.map(b=>({
            ...b
        })),

        crops:crops.map(c=>({
            ...c
        })),

        discovered:state.discovered
    };

    try{
        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(data)
        );
    }catch(e){}
}

function loadGame(){

    try{

        const raw=
            localStorage.getItem(SAVE_KEY);

        if(!raw)return;

        const d=JSON.parse(raw);

        Object.assign(
            world,
            d.world
        );

        Object.assign(
            state,
            d.state
        );

        Object.assign(
            player,
            d.player
        );

        npcs.length=0;

        for(const n of d.npcs||[]){
            npcs.push(n);
        }

        buildings.length=0;

        for(const b of d.buildings||[]){
            buildings.push(b);
        }

        crops.length=0;

        for(const c of d.crops||[]){
            crops.push(c);
        }

    }catch(e){

        console.warn(
            "Save load error",
            e
        );
    }
}

function resetGame(){

    if(!confirm(
        "Удалить сохранение и начать заново?"
    ))return;

    localStorage.removeItem(SAVE_KEY);

    location.reload();
}

function drawMinimap(){

    const size=150;
    const x=W-size-18;
    const y=H-size-18;

    ctx.save();

    ctx.fillStyle="rgba(5,8,12,.76)";
    ctx.fillRect(x,y,size,size);

    ctx.strokeStyle="rgba(255,255,255,.14)";
    ctx.strokeRect(x,y,size,size);

    for(let i=0;i<80;i++){

        const wx=rand(0,world.width);
        const wy=rand(0,world.height);

        const r=getRegion(wx,wy);

        ctx.fillStyle=
            r==="forest"?"#3d6544":
            r==="marsh"?"#4d5c45":
            r==="mountain"?"#73757a":
            r==="coast"?"#416b71":
            "#566447";

        ctx.fillRect(
            x+wx/world.width*size,
            y+wy/world.height*size,
            2,
            2
        );
    }

    for(const l of landmarks){

        if(
            !state.discovered[l.id] &&
            l.id!=="village"
        )continue;

        ctx.fillStyle=
            l.type==="village"?
            "#eee8bb":
            "#b7b0ff";

        ctx.beginPath();

        ctx.arc(
            x+l.x/world.width*size,
            y+l.y/world.height*size,
            l.type==="village"?3:2,
            0,
            TAU
        );

        ctx.fill();
    }

    ctx.fillStyle="#ffffff";

    ctx.beginPath();

    ctx.arc(
        x+player.x/world.width*size,
        y+player.y/world.height*size,
        3,
        0,
        TAU
    );

    ctx.fill();

    ctx.restore();
}

/* ============================================================
   LANDMARKS
============================================================ */

function drawLandmarks(){

    for(const l of landmarks){

        if(
            l.id!=="village" &&
            !state.discovered[l.id]
        )continue;

        const sx=screenX(l.x);
        const sy=screenY(l.y);

        if(
            sx<-100||
            sy<-100||
            sx>W+100||
            sy>H+100
        )continue;

        ctx.save();

        ctx.translate(sx,sy);

        if(l.type==="lake"){
            /* handled by water */
        }
        else if(l.type==="village"){
            ctx.fillStyle="rgba(236,223,164,.13)";
            ctx.beginPath();
            ctx.arc(
                0,
                0,
                150*camera.zoom,
                0,
                TAU
            );
            ctx.fill();
        }
        else if(l.type==="ruins"){
            ctx.strokeStyle="rgba(190,182,152,.45)";
            ctx.lineWidth=4*camera.zoom;

            ctx.strokeRect(
                -70*camera.zoom,
                -50*camera.zoom,
                140*camera.zoom,
                100*camera.zoom
            );
        }

        ctx.restore();
    }
}

/* ============================================================
   GAME UPDATE
============================================================ */

let last=performance.now();

function update(dt){

    updateTime(dt);
    updateWeather(dt);
    updateCamera(dt);

    const input=movementInput();

    let mx=input.x;
    let my=input.y;

    if(joy.active){
        mx=joy.x;
        my=joy.y;
    }

    const moving=mx!==0||my!==0;

    player.moving=moving;

    if(moving){

        let speed=player.speed;

        const sprint=
            keys.shift||
            (
                joy.active&&
                Math.hypot(mx,my)>.8
            );

        if(
            sprint &&
            player.stamina>0
        ){
            speed=player.sprint;
            player.stamina-=dt*18;
        }else{
            player.stamina+=dt*10;
        }

        player.stamina=
            clamp(
                player.stamina,
                0,
                100
            );

        player.vx=mx*speed;
        player.vy=my*speed;

        player.x+=player.vx*dt;
        player.y+=player.vy*dt;

        player.facing=
            Math.atan2(my,mx);

    }else{

        player.vx*=.8;
        player.vy*=.8;

        player.stamina=
            clamp(
                player.stamina+dt*13,
                0,
                100
            );
    }

    player.x=
        clamp(
            player.x,
            80,
            world.width-80
        );

    player.y=
        clamp(
            player.y,
            80,
            world.height-80
        );

    player.attackTimer=
        Math.max(
            0,
            player.attackTimer-dt
        );

    player.interactCooldown=
        Math.max(
            0,
            player.interactCooldown-dt
        );

    updateNPCs(dt);
    updateEnemies(dt);
    updateParticles(dt);
    updateFloating(dt);
    updateEvents(dt);
    updateRespawns(dt);

    checkQuestProgress();
    updateInteraction();

    dayAccumulator+=dt;

    if(dayAccumulator>20){
        dayAccumulator=0;

        if(chance(.18)){
            saveGame();
        }
    }
}

function updateRespawns(dt){

    for(const o of objects){

        if(o.hp<=0){

            o.respawn-=dt;

            if(o.respawn<=0){
                o.hp=o.maxHp;
            }
        }
    }
}

/* ============================================================
   RENDER
============================================================ */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawTerrain();

    drawLandmarks();

    /* objects sorted by y */

    const renderables=[
        ...objects.filter(o=>o.hp>0),
        ...buildings,
        ...npcs.filter(n=>n.alive),
        ...enemies.map(e=>({
            ...e,
            isEnemy:true
        })),
        {
            ...player,
            isPlayer:true
        }
    ];

    renderables.sort(
        (a,b)=>a.y-b.y
    );

    for(const o of renderables){

        if(o.isPlayer){
            drawPlayer();
            continue;
        }

        if(o.isEnemy){
            drawEnemy(o);
            continue;
        }

        if(o.type==="tree"){
            drawTree(
                o.x,
                o.y,
                1
            );
            continue;
        }

        if(o.type==="rock"||
           o.type==="ore"){
            drawRock(
                o.x,
                o.y,
                1
            );
            continue;
        }

        if(o.type==="herb"){
            drawHerb(
                o.x,
                o.y
            );
            continue;
        }

        if(o.type&&buildingDefs[o.type]){
            drawBuilding(o);
            continue;
        }

        if(o.profession){
            drawNPC(o);
        }
    }

    drawCrops();
    drawParticles();
    drawFloating();
    drawWeather();
    drawLighting();
    drawMinimap();
}

function drawHerb(x,y){

    const sx=screenX(x);
    const sy=screenY(y);

    if(sx<-20||sy<-20||sx>W+20||sy>H+20)return;

    ctx.save();

    ctx.translate(sx,sy);
    ctx.scale(camera.zoom,camera.zoom);

    ctx.strokeStyle="#86a768";
    ctx.lineWidth=2;

    for(let i=-2;i<=2;i++){

        ctx.beginPath();

        ctx.moveTo(0,8);

        ctx.quadraticCurveTo(
            i*3,
            -2,
            i*5,
            -12
        );

        ctx.stroke();
    }

    ctx.fillStyle="#8c9b65";

    ctx.beginPath();
    ctx.arc(0,-10,3,0,TAU);
    ctx.fill();

    ctx.restore();
}

function drawCrops(){

    for(const c of crops){

        const sx=screenX(c.x);
        const sy=screenY(c.y);

        if(
            sx<-30||
            sy<-30||
            sx>W+30||
            sy>H+30
        )continue;

        const h=
            2+
            c.growth*13;

        ctx.strokeStyle=
            c.growth>=1?
            "#d5c36d":
            "#71925e";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(sx,sy+7);
        ctx.lineTo(sx,sy-h);

        ctx.stroke();

        if(c.growth>=1){

            ctx.fillStyle="#d8c978";

            ctx.beginPath();
            ctx.arc(
                sx,
                sy-h,
                3,
                0,
                TAU
            );

            ctx.fill();
        }
    }
}

function drawEnemy(e){

    const sx=screenX(e.x);
    const sy=screenY(e.y);

    if(
        sx<-70||
        sy<-70||
        sx>W+70||
        sy>H+70
    )return;

    const d=enemyTypes[e.type];

    ctx.save();

    ctx.translate(sx,sy);
    ctx.scale(camera.zoom,camera.zoom);

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.ellipse(
        0,
        d.radius*.65,
        d.radius*.9,
        d.radius*.35,
        0,
        0,
        TAU
    );
    ctx.fill();

    ctx.fillStyle=
        e.type==="wolf"?
        "#5e6672":
        e.type==="corrupted"?
        "#66507a":
        "#77736b";

    ctx.beginPath();
    ctx.arc(
        0,
        0,
        d.radius,
        0,
        TAU
    );

    ctx.fill();

    if(e.type==="wolf"){

        ctx.fillStyle="#30333a";

        ctx.beginPath();
        ctx.moveTo(-11,-13);
        ctx.lineTo(-17,-30);
        ctx.lineTo(-3,-18);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(11,-13);
        ctx.lineTo(17,-30);
        ctx.lineTo(3,-18);
        ctx.closePath();
        ctx.fill();
    }

    if(e.type==="guardian"){

        ctx.strokeStyle="rgba(255,220,150,.3)";
        ctx.lineWidth=3;

        ctx.strokeRect(
            -d.radius*.6,
            -d.radius*.6,
            d.radius*1.2,
            d.radius*1.2
        );
    }

    ctx.fillStyle="#efc2a0";

    ctx.beginPath();
    ctx.arc(
        -5,
        -2,
        2,
        0,
        TAU
    );

    ctx.arc(
        5,
        -2,
        2,
        0,
        TAU
    );

    ctx.fill();

    /* health */

    ctx.fillStyle="rgba(0,0,0,.5)";
    ctx.fillRect(
        -22,
        -d.radius-12,
        44,
        5
    );

    ctx.fillStyle="#c57c7c";

    ctx.fillRect(
        -22,
        -d.radius-12,
        44*(e.hp/e.maxHp),
        5
    );

    ctx.restore();
}

/* ============================================================
   GAME LOOP
============================================================ */

function loop(now){

    const dt=
        Math.min(
            .05,
            (now-last)/1000
        );

    last=now;

    update(dt);
    render();

    requestAnimationFrame(loop);
}

/* ============================================================
   INITIALIZATION
============================================================ */

function init(){

    loadGame();

    camera.x=
        player.x-
        W/(2*camera.zoom);

    camera.y=
        player.y-
        H/(2*camera.zoom);

    if(!state.quests.length){
        addQuest("firstFaith");
    }

    updateUI();

    setTimeout(()=>{

        const loading=
            document.getElementById("loading");

        loading.style.opacity="0";

        setTimeout(()=>{
            loading.remove();
        },600);

    },900);

    toast(
        "Последний Алтарь",
        "Мир проснулся. Решения имеют последствия."
    );

    requestAnimationFrame(loop);
}

init();

/* ============================================================
   EXTRA SYSTEMS
============================================================ */

/*
    Ниже находятся дополнительные системы,
    которые специально не завязаны на сервер.

    Идея проекта:

    Мир = состояние.

    NPC = состояние + память.

    Фракция = отношение к состоянию мира.

    Решение = изменение нескольких систем.

    Поэтому игрок не получает только цифру
    "+10 славы".

    Вместо этого решение может изменить:

    faith
    morale
    prosperity
    security
    reputation
    npc.trust
    npc.mood
    npc.memory
    storyChapter
    discovered regions
    market prices
    future events
    available quests
    endings

    Это позволяет расширять игру без превращения
    каждого события в отдельный декоративный экран.
*/

/* ============================================================
   RELATIONSHIPS
============================================================ */

function updateRelationships(){

    for(let i=0;i<npcs.length;i++){

        for(let j=i+1;j<npcs.length;j++){

            const a=npcs[i];
            const b=npcs[j];

            if(!a.friendship[b.id]){
                a.friendship[b.id]=0;
            }

            if(!b.friendship[a.id]){
                b.friendship[a.id]=0;
            }

            const compatibility=
                personalityCompatibility(
                    a.personality,
                    b.personality
                );

            a.friendship[b.id]+=
                compatibility*.001;

            b.friendship[a.id]+=
                compatibility*.001;

            if(
                a.friendship[b.id]>40 &&
                b.friendship[a.id]>40
            ){

                if(chance(.0004)){
                    toast(
                        "Связи жителей",
                        `${a.name} и ${b.name} стали ближе.`
                    );
                }
            }

            if(
                a.friendship[b.id]<-20 &&
                b.friendship[a.id]<-20
            ){

                if(chance(.0004)){
                    state.morale-=1;

                    toast(
                        "Конфликт",
                        `${a.name} и ${b.name} поссорились.`
                    );
                }
            }
        }
    }
}

function personalityCompatibility(a,b){

    if(a===b)return 2;

    const pairs={
        "спокойный-трудолюбивый":2,
        "добрый-мечтательный":2,
        "любопытный-любопытный":3,
        "гордый-вспыльчивый":-3,
        "подозрительный-гордый":-2,
        "амбициозный-гордый":1
    };

    return pairs[a+"-"+b]||
           pairs[b+"-"+a]||
           0;
}

/* ============================================================
   ACHIEVEMENTS
============================================================ */

const achievementDefs=[
    {
        id:"first_build",
        name:"Камень за камнем",
        check:()=>buildings.length>=7
    },
    {
        id:"population",
        name:"Маленький народ",
        check:()=>state.population>=20
    },
    {
        id:"wealth",
        name:"Торговая держава",
        check:()=>state.gold>=500
    },
    {
        id:"mercy",
        name:"Милосердие",
        check:()=>state.mercy>=30
    },
    {
        id:"wrath",
        name:"Гром небесный",
        check:()=>state.wrath>=30
    },
    {
        id:"mystery",
        name:"Тот, кто видит",
        check:()=>state.mystery>=30
    },
    {
        id:"explorer",
        name:"За горизонтом",
        check:()=>Object.values(state.discovered).filter(Boolean).length>=5
    },
    {
        id:"knowledge",
        name:"Хранитель знаний",
        check:()=>state.knowledge>=50
    }
];

function checkAchievements(){

    for(const a of achievementDefs){

        if(
            !state.achievements.includes(a.id) &&
            a.check()
        ){

            state.achievements.push(a.id);

            state.glory+=5;

            toast(
                "Достижение",
                a.name
            );
        }
    }
}

setInterval(()=>{

},5000);

            particle(

            );
