<style>

    --text:#edf2f7;

}

html,body{

    width:100%;
    height:100%;
    overflow:hidden;

button{

#game{

    width:100%;
    height:100%;

    touch-action:none;
}

#hud{

    left:12px;
    right:12px;
    top:10px;

.hud-group{

.stat{

}

.stat b{

    font-size:13px;
}

.stat span{
    color:var(--muted);
    font-size:10px;
}

#topRight{
    margin-left:auto;
    display:flex;
    gap:6px;
    pointer-events:auto;
}

.iconBtn{
    width:40px;
    height:40px;
    border:1px solid var(--line);
    border-radius:9px;
    background:rgba(10,13,18,.9);
    cursor:pointer;
}

.iconBtn:hover{

}

#bottom{

    left:50%;

.action{

.action small{

#side{

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const mini = document.getElementById("mini");

let W = innerWidth;
let H = innerHeight;

function resize(){
    W = innerWidth;
    H = innerHeight;

    canvas.width = Math.floor(W * devicePixelRatio);
    canvas.height = Math.floor(H * devicePixelRatio);
    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

    mini.width = 360;
    mini.height = 250;
}

addEventListener("resize",resize);
resize();

/* ============================================================
   UTILITIES
============================================================ */

const TAU = Math.PI * 2;

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
    return a+(b-a)*t;
}

function dist(a,b,c,d){
    return Math.hypot(a-c,b-d);
}

function rand(min,max){
    return Math.random()*(max-min)+min;
}

function randi(min,max){
    return Math.floor(rand(min,max+1));
}

function pick(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function uid(prefix="id"){
    return prefix+"_"+Math.random().toString(36).slice(2,10);
}

function formatNum(n){
    return Math.floor(n).toLocaleString("ru-RU");
}

/* ============================================================
   SEEDED RANDOM
============================================================ */

class RNG{
    constructor(seed){
        this.seed = seed >>> 0;
    }

    next(){
        let x = this.seed;
        x ^= x << 13;
        x ^= x >>> 17;
        x ^= x << 5;
        this.seed = x >>> 0;
        return (this.seed >>> 0)/4294967296;
    }

    float(a=0,b=1){
        return a+(b-a)*this.next();
    }

    int(a,b){
        return Math.floor(this.float(a,b+1));
    }

    choice(a){
        return a[Math.floor(this.next()*a.length)];
    }
}

/* ============================================================
   WORLD GENERATION
============================================================ */

let rng = new RNG(game.seed);

const terrain = new Float32Array(
    Math.ceil(WORLD.width/40) *
    Math.ceil(WORLD.height/40)
);

const biomeGrid = [];

function noise2(x,y){
    const n =
        Math.sin(x*0.013+y*0.017+game.seed)*43758.5453;
    return n-Math.floor(n);
}

function smoothNoise(x,y){
    const x0=Math.floor(x);
    const y0=Math.floor(y);

    const xf=x-x0;
    const yf=y-y0;

    const a=noise2(x0,y0);
    const b=noise2(x0+1,y0);
    const c=noise2(x0,y0+1);
    const d=noise2(x0+1,y0+1);

    const u=xf*xf*(3-2*xf);
    const v=yf*yf*(3-2*yf);

    return lerp(lerp(a,b,u),lerp(c,d,u),v);
}

function worldNoise(x,y){
    return (
        smoothNoise(x*.5,y*.5)*.55+
        smoothNoise(x*.16,y*.16)*.3+
        smoothNoise(x*.05,y*.05)*.15
    );
}

function biomeAt(x,y){
    const n=worldNoise(x,y);

    const cx=WORLD.width/2;
    const cy=WORLD.height/2;

    const dx=(x-cx)/WORLD.width;
    const dy=(y-cy)/WORLD.height;
    const d=Math.sqrt(dx*dx+dy*dy);

    if(d<.18) return "meadow";

    if(n<.22) return "swamp";
    if(n<.37) return "forest";
    if(n<.54) return "meadow";
    if(n<.70) return "mountain";
    if(n<.84) return "coast";
    return "wasteland";
}

function waterAt(x,y){
    const n=worldNoise(x+900,y-500);

    const edgeX=Math.abs(x-WORLD.width/2)/(WORLD.width/2);
    const edgeY=Math.abs(y-WORLD.height/2)/(WORLD.height/2);

    return (
        (edgeX>.82 && n>.38) ||
        (edgeY>.82 && n>.45)
    );
}

/* ============================================================
   BUILDING SYSTEM
============================================================ */

function countBuilding(type){
    return game.buildings.filter(b=>b.type===type).length;
}

function canAfford(cost){
    for(const k in cost){
        const value =
            k==="gold"?game.gold:
            k==="food"?game.food:
            game[k]??0;

        if(value<cost[k]) return false;
    }
    return true;
}

function payCost(cost){
    for(const k in cost){
        if(k==="gold") game.gold-=cost[k];
        else if(k==="food") game.food-=cost[k];
        else if(k in game) game[k]-=cost[k];
    }
}

function updateCapacity(){
    let capacity=8;

    for(const b of game.buildings){
        if(b.type==="house"){
            capacity+=BUILDINGS.house.housing;
        }

        if(b.type==="temple"){
            capacity+=4;
        }
    }

    game.capacity=capacity;
}

function placeBuilding(type,x,y){
    const def=BUILDINGS[type];

    if(!def) return false;

    if(countBuilding(type)>=def.max){
        toast("Достигнут предел этого здания.");
        return false;
    }

    if(!canAfford(def.cost)){
        toast("Не хватает ресурсов.");
        return false;
    }

    if(waterAt(x,y)){
        toast("Здесь нельзя строить на воде.");
        return false;
    }

    if(dist(x,y,settlement.x,settlement.y)>760){
        toast("Слишком далеко от поселения.");
        return false;
    }

    for(const b of game.buildings){
        if(dist(x,y,b.x,b.y)<(def.size+b.size)*.45){
            toast("Здесь уже что-то построено.");
            return false;
        }
    }

    payCost(def.cost);

    game.buildings.push({
        id:uid("building"),
        type,
        x,
        y,
        hp:100,
        level:1,
        progress:1
    });

    updateCapacity();

    toast(`${def.name} построено.`);
    achievement("builder");

    return true;
}

function getQuest(id){
    return QUESTS.find(q=>q.id===id);
}

function startNextQuest(){
    for(const q of QUESTS){
        if(q.chapter<=game.chapter &&
           !game.completedQuests.includes(q.id)){
            game.activeQuest=q.id;
            toast(`Новое задание: ${q.title}`);
            return;
        }
    }
}

function questProgress(q){
    const o=q.objective;

    if(o.type==="faith") return Math.min(game.faith,o.amount);

    if(o.type==="build"){
        return countBuilding(o.building);
    }

    if(o.type==="discover"){
        return game.discoveries.length;
    }

    if(o.type==="dungeon"){
        return game.dungeons.filter(d=>d.cleared).length;
    }

    return 0;
}

function updateQuest(){
    if(!game.activeQuest){
        startNextQuest();
        return;
    }

    const q=getQuest(game.activeQuest);

    if(!q) return;

    if(questProgress(q)>=q.objective.amount){
        completeQuest(q);
    }
}

function completeQuest(q){
    game.completedQuests.push(q.id);
    game.activeQuest=null;

    for(const k in q.reward){
        if(k in game) game[k]+=q.reward[k];
    }

    game.glory+=20;
    toast(`Задание выполнено: ${q.title}`);

    if(q.chapter>=game.chapter){
        game.chapter=Math.min(12,game.chapter+1);
        storyChapter();
    }

    achievement("quester");
}

const skillLevels={
    mercy:0,
    wrath:0,
    mystery:0
};

function useAbility(type){
    let power=POWERS[type];

    if(!power) return;

    if(game.faith<power.cost){
        toast("Недостаточно веры.");
        return;
    }

    game.faith-=power.cost;

    if(type==="blessing"){
        game.mercy++;
        let npc=nearestNPC(180);

        if(npc){
            npc.hp=npc.maxHp;
            npc.mood=clamp(npc.mood+25,0,100);
            npc.faith=clamp(npc.faith+20,0,100);
            burst(npc.x,npc.y,"holy",20);
            toast(`${npc.name} чувствует твоё присутствие.`);
        }else{
            toast("Никого достаточно близко.");
        }
    }

    if(type==="rain"){
        game.mercy+=2;
        game.weather="rain";
        game.weatherTimer=60*5;

        for(const b of game.buildings){
            if(b.type==="farm"){
                game.food+=6;
            }
        }

        burst(player.x,player.y,"rain",50);
        toast("Над долиной начинается благословенный дождь.");
    }

    if(type==="heal"){
        game.mercy+=3;

        for(const npc of game.npcs){
            if(dist(npc.x,npc.y,player.x,player.y)<450){
                npc.hp=npc.maxHp;
            }
        }

        player.hp=player.maxHp;
        burst(player.x,player.y,"holy",60);
        toast("Жизнь возвращается в долину.");
    }

    if(type==="wrath"){
        game.wrath++;

        let enemy=nearestEnemy(650);

        if(enemy){
            damageEnemy(enemy,45+game.wrath*1.5);
            lightning(enemy.x,enemy.y);
            toast("Небеса обрушили свой гнев.");
        }else{
            toast("Рядом нет цели.");
        }
    }

    if(type==="storm"){
        game.wrath+=4;

        for(let i=0;i<5;i++){
            setTimeout(()=>{
                const a=rand(0,TAU);
                const d=rand(100,600);
                const x=player.x+Math.cos(a)*d;
                const y=player.y+Math.sin(a)*d;

                lightning(x,y);

                for(const e of game.enemies){
                    if(dist(x,y,e.x,e.y)<150){
                        damageEnemy(e,55);
                    }
                }
            },i*220);
        }

        game.weather="storm";
        game.weatherTimer=35;
    }

    if(type==="curse"){
        game.wrath+=2;

        for(const e of game.enemies){
            if(dist(e.x,e.y,player.x,player.y)<500){
                e.hitTimer=3;
            }
        }

        burst(player.x,player.y,"dark",35);
    }

    if(type==="vision"){
        game.mystery+=2;

        for(const d of game.dungeons){
            d.discovered=true;
        }

        toast("Ты видишь то, что скрывалось от смертных.");
    }

    if(type==="teleport"){
        game.mystery+=3;

        const target=game.dungeons.find(d=>d.discovered&&!d.cleared);

        if(target){
            player.x=target.x;
            player.y=target.y;
            toast(`Ты оказался у ${target.name}.`);
        }else{
            toast("Нет открытой точки для перемещения.");
        }
    }

    if(type==="eclipse"){
        game.mystery+=8;
        game.weather="eclipse";
        game.weatherTimer=90;

        burst(player.x,player.y,"dark",100);
        toast("На мир опустилось затмение.");
    }

    achievement(
        type==="blessing"||type==="rain"||type==="heal"
        ?"merciful":
        type==="wrath"||type==="storm"||type==="curse"
        ?"wrathful":
        "explorer"
    );
}

/* ============================================================
   COMBAT
============================================================ */

function playerAttack(){
    if(player.attackCooldown>0) return;

    player.attackCooldown=.48;
    player.attackTimer=.22;

    const range=player.weapon?65:52;
    const damage=player.damage+(player.weapon?ITEMS[player.weapon].damage:0);

    let hits=0;

    for(const enemy of [...game.enemies]){
        if(dist(player.x,player.y,enemy.x,enemy.y)<range+enemy.radius){
            const angle=Math.atan2(enemy.y-player.y,enemy.x-player.x);

            const diff=Math.atan2(
                Math.sin(angle-player.facing),
                Math.cos(angle-player.facing)
            );

            if(Math.abs(diff)<1.35){
                damageEnemy(enemy,damage);
                hits++;
            }
        }
    }

    if(hits) burst(player.x+Math.cos(player.facing)*40,
                   player.y+Math.sin(player.facing)*40,
                   "hit",8);
}

function damageEnemy(enemy,damage){
    enemy.hp-=damage;
    enemy.hitTimer=.12;

    particle(enemy.x,enemy.y,{
        text:"-"+Math.floor(damage),
        type:"text",
        vy:-30,
        life:.8
    });

    if(enemy.hp<=0){
        killEnemy(enemy);
    }
}

function killEnemy(enemy){
    const def=ENEMIES[enemy.type];

    game.gold+=def.gold;
    player.xp+=def.xp;

    if(enemy.type==="wolf"){
        game.food+=8;
    }

    if(enemy.type==="bandit"){
        game.gold+=15;
        if(Math.random()<.2) game.iron++;
    }

    if(enemy.type==="wraith"){
        game.faith+=10;
        if(Math.random()<.25) game.crystal++;
    }

    if(enemy.type==="guardian"){
        game.crystal+=4;
        game.glory+=150;
        game.storyFlags.guardianDefeated=true;
        toast("Хранитель пал. Древняя дверь открылась.");
    }

    burst(enemy.x,enemy.y,"dark",20);

    const index=game.enemies.indexOf(enemy);
    if(index>=0) game.enemies.splice(index,1);

    checkLevel();
}

function checkLevel(){
    while(player.xp>=player.nextXp){
        player.xp-=player.nextXp;
        player.level++;
        player.nextXp=Math.floor(player.nextXp*1.35);

        player.maxHp+=8;
        player.hp=player.maxHp;
        player.damage+=2;

        game.faith+=20;
        game.glory+=20;

        toast(`Уровень ${player.level}!`);

        if(player.level>=10){
            achievement("master");
        }
    }
}

function enemyAI(dt){
    for(const e of game.enemies){
        const def=ENEMIES[e.type];

        if(e.hitTimer>0) e.hitTimer-=dt;

        const d=dist(e.x,e.y,player.x,player.y);

        if(d<520){
            e.target=player;
            e.state="chase";

            if(d>45){
                const dx=(player.x-e.x)/d;
                const dy=(player.y-e.y)/d;

                let speed=def.speed;

                if(e.hitTimer>0) speed*=.5;

                e.x+=dx*speed*dt;
                e.y+=dy*speed*dt;
            }else{
                e.state="attack";

                e.attackTimer-=dt;

                if(e.attackTimer<=0){
                    e.attackTimer=1.2;

                    if(player.invincible<=0){
                        player.hp-=def.damage;
                        player.invincible=.45;

                        particle(player.x,player.y,{
                            text:"-"+def.damage,
                            type:"text",
                            vy:-30,
                            life:.7
                        });

                        if(player.hp<=0){
                            player.hp=player.maxHp;
                            player.x=settlement.x;
                            player.y=settlement.y;
                            game.gold=Math.max(0,game.gold-30);
                            toast("Ты вернулся к храму.");
                        }
                    }
                }
            }
        }else{
            e.state="idle";
        }
    }
}

/* ============================================================
   NPC AI
============================================================ */

function npcAI(dt){
    for(const npc of game.npcs){
        if(!npc.alive) continue;

        npc.hunger+=dt*.7;

        if(npc.hunger>90){
            npc.mood-=dt*.8;
        }

        if(npc.mood<25){
            npc.stress+=dt*.3;
        }

        npc.workTimer-=dt;
        npc.socialTimer-=dt;
        npc.moveTimer-=dt;

        const hour=game.time/60;

        if(npc.moveTimer<=0){
            npc.moveTimer=rand(1,3);

            let targetX=npc.x;
            let targetY=npc.y;

            if(hour>=7 && hour<17){
                const farms=game.buildings.filter(b=>
                    b.type==="farm"
                );

                const forge=game.buildings.find(b=>b.type==="forge");

                const market=game.buildings.find(b=>b.type==="market");

                if(npc.job==="фермер" && farms.length){
                    const b=pick(farms);
                    targetX=b.x;
                    targetY=b.y;
                }else if(npc.job==="кузнец" && forge){
                    targetX=forge.x;
                    targetY=forge.y;
                }else if(npc.job==="торговец" && market){
                    targetX=market.x;
                    targetY=market.y;
                }else{
                    targetX=settlement.x+rand(-400,400);
                    targetY=settlement.y+rand(-300,300);
                }
            }else if(hour>=18 || hour<6){
                const houses=game.buildings.filter(b=>
                    b.type==="house"
                );

                if(houses.length){
                    const b=houses[npc.id.charCodeAt(4)%houses.length];
                    targetX=b.x;
                    targetY=b.y;
                }else{
                    targetX=settlement.x;
                    targetY=settlement.y;
                }
            }else{
                targetX=settlement.x+rand(-250,250);
                targetY=settlement.y+rand(-200,200);
            }

            npc.target={x:targetX,y:targetY};
        }

        if(npc.target){
            const d=dist(npc.x,npc.y,npc.target.x,npc.target.y);

            if(d>15){
                npc.x+=((npc.target.x-npc.x)/d)*npc.speed*dt;
                npc.y+=((npc.target.y-npc.y)/d)*npc.speed*dt;
                npc.state="walking";
            }else{
                npc.state="working";
            }
        }

        if(npc.workTimer<=0 && npc.state==="working"){
            npc.workTimer=12;

            if(npc.job==="фермер"){
                const farms=countBuilding("farm");

                if(farms){
                    game.food+=farms*2;
                    game.wheat+=farms*2;
                }
            }

            if(npc.job==="лесоруб"){
                game.wood+=3;
            }

            if(npc.job==="каменщик"){
                game.stone+=2;
            }

            if(npc.job==="шахтёр"){
                game.iron+=Math.random()<.35?1:0;
                game.coal+=1;
            }

            if(npc.job==="рыбак"){
                game.food+=2;
            }

            if(npc.job==="торговец"){
                game.gold+=1;
            }

            if(npc.job==="учёный"){
                game.knowledge+=1;
            }

            if(npc.job==="жрец"){
                game.faith+=1;
            }
        }

        if(npc.socialTimer<=0){
            npc.socialTimer=rand(15,35);

            const other=nearestNPCFrom(npc,100);

            if(other){
                npc.mood=clamp(npc.mood+2,0,100);
                other.mood=clamp(other.mood+2,0,100);

                npc.friendship[other.id]=(npc.friendship[other.id]||0)+1;
                other.friendship[npc.id]=(other.friendship[npc.id]||0)+1;
            }
        }

        npc.faith+=dt*.005*(game.faith>500?1:-1);

        npc.faith=clamp(npc.faith,0,100);
        npc.mood=clamp(npc.mood,0,100);
        npc.hunger=clamp(npc.hunger,0,100);
    }
}

function nearestNPC(range=Infinity){
    let best=null;
    let bestD=range;

    for(const npc of game.npcs){
        const d=npcDistance(npc);

        if(d<bestD){
            best=npc;
            bestD=d;
        }
    }

    return best;
}

function nearestNPCFrom(npc,range){
    let best=null;
    let bestD=range;

    for(const other of game.npcs){
        if(other===npc) continue;

        const d=dist(npc.x,npc.y,other.x,other.y);

        if(d<bestD){
            best=other;
            bestD=d;
        }
    }

    return best;
}

function nearestEnemy(range=Infinity){
    let best=null;
    let bestD=range;

    for(const e of game.enemies){
        const d=dist(player.x,player.y,e.x,e.y);

        if(d<bestD){
            best=e;
            bestD=d;
        }
    }

    return best;
}

   GATHERING
============================================================ */

function gather(resource){
    if(resource.amount<=0) return;

    const type=resource.type;
    const amount=Math.min(resource.amount,randi(1,3));

    resource.amount-=amount;

    if(type==="wood") game.wood+=amount;
    if(type==="stone") game.stone+=amount;
    if(type==="iron") game.iron+=amount;
    if(type==="coal") game.coal+=amount;
    if(type==="herb") game.herb+=amount;
    if(type==="crystal") game.crystal+=amount;
    if(type==="wheat"){
        game.wheat+=amount;
        game.food+=amount;
    }
    if(type==="fish"){
        game.food+=amount*2;
    }

    burst(resource.x,resource.y,"gather",8);

    toast(`+${amount} ${ITEMS[type]?.name||type}`);

    if(resource.amount<=0){
        resource.respawn=rand(35,90);
    }
}

/* ============================================================
   INTERACTION
============================================================ */

function interact(){
    const npc=nearestNPC(75);

    if(npc){
        talkToNPC(npc);
        return;
    }

    let nearest=null;
    let best=65;

    for(const r of game.resources){
        const d=dist(player.x,player.y,r.x,r.y);

        if(d<best && r.amount>0){
            best=d;
            nearest=r;
        }
    }

    if(nearest){
        gather(nearest);
        return;
    }

    for(const d of game.dungeons){
        const dd=dist(player.x,player.y,d.x,d.y);

        if(dd<100){
            enterDungeon(d);
            return;
        }
    }

    for(const b of game.buildings){
        const dd=dist(player.x,player.y,b.x,b.y);

        if(dd<b.size*.75){
            buildingInteract(b);
            return;
        }
    }

    if(dist(player.x,player.y,settlement.x,settlement.y)<100){
        templePrayer();
        return;
    }

    toast("Здесь нечего делать.");
}

function talkToNPC(npc){
    const relationship=
        Object.values(npc.friendship).reduce((a,b)=>a+b,0);

    let text=
        `${npc.name}, ${npc.age} лет. `+
        `Работа: ${npc.job}. `+
        `Характер: ${npc.trait}. `+
        `Настроение: ${Math.floor(npc.mood)}/100. `+
        `Вера: ${Math.floor(npc.faith)}/100. `+
        `${npc.desire}.`;

    const options=[
        {
            text:"Благословить",
            action:()=>{
                npc.faith=clamp(npc.faith+15,0,100);
                npc.mood=clamp(npc.mood+10,0,100);
                game.faith+=4;
                game.favor+=2;
                closeDialog();
            }
        },
        {
            text:"Спросить о жизни",
            action:()=>{
                showDialog(
                    npc.name,
                    randomNPCStory(npc),
                    [
                        {
                            text:"Продолжить",
                            action:()=>closeDialog()
                        }
                    ]
                );
            }
        },
        {
            text:"Изменить работу",
            action:()=>{
                npc.job=pick(JOBS);
                toast(`${npc.name} теперь ${npc.job}.`);
                closeDialog();
            }
        }
    ];

    showDialog(npc.name,text,options);
}

function randomNPCStory(npc){
    const stories=[
        `«Иногда мне кажется, что мы слишком мало знаем об этом месте. Но здесь впервые за много лет я чувствую себя дома».`,
        `«Вчера я видел свет над северными горами. Это не был обычный огонь».`,
        `«Если храм действительно слышит нас, я хочу попросить только об одном — чтобы наши дети никогда не увидели войну».`,
        `«Я давно хочу ${npc.desire.replace("хочет ","")}. Но пока работа важнее».`
    ];

    return pick(stories);
}

    game.favor+=1;

/* ============================================================
   CRAFTING
============================================================ */

function hasItems(cost){
    for(const k in cost){
        const v=
            k==="wheat"?game.wheat:
            k==="crystal"?game.crystal:
            game[k]??0;

        if(v<cost[k]) return false;
    }

    return true;
}

function removeItems(cost){
    for(const k in cost){
        if(k==="wheat") game.wheat-=cost[k];
        else if(k==="crystal") game.crystal-=cost[k];
        else if(k in game) game[k]-=cost[k];
    }
}

function craft(recipeId){
    const r=RECIPES[recipeId];

    if(!r) return;

    if(!countBuilding(r.station)){
        toast(`Нужна постройка: ${BUILDINGS[r.station].name}.`);
        return;
    }

    if(!hasItems(r.cost)){
        toast("Не хватает материалов.");
        return;
    }

    removeItems(r.cost);

    addItem(r.output,r.amount);

    game.knowledge+=2;

    toast(`Создано: ${ITEMS[r.output].name}.`);
}

   INVENTORY
============================================================ */

const inventory={};

function addItem(id,amount=1){
    inventory[id]=(inventory[id]||0)+amount;
}

function removeItem(id,amount=1){
    inventory[id]=(inventory[id]||0)-amount;

    if(inventory[id]<=0) delete inventory[id];
}

function equip(id){
    if(!inventory[id]) return;

    if(ITEMS[id].type!=="weapon"){
        toast("Это нельзя экипировать.");
        return;
    }

    player.weapon=id;
    toast(`${ITEMS[id].name} экипирован.`);
}

   MARKET
============================================================ */

const marketPrices={
    wood:3,
    stone:3,
    iron:12,
    coal:7,
    herb:8,
    crystal:45,
    fish:8,
    wheat:5,
    bread:13,
    meat:18
};

function sellItem(id){
    const count=
        id==="wood"?game.wood:
        id==="stone"?game.stone:
        id==="iron"?game.iron:
        id==="coal"?game.coal:
        id==="herb"?game.herb:
        id==="crystal"?game.crystal:
        id==="wheat"?game.wheat:
        0;

    if(count<=0){
        toast("Нечего продавать.");
        return;
    }

    const amount=Math.min(count,10);
    const price=marketPrices[id]||1;

    if(id in game){
        game[id]-=amount;
    }

    game.gold+=amount*price;

    toast(`Продано ${amount} ед. товара.`);
}

function buyFood(){
    if(game.gold<40){
        toast("Не хватает золота.");
        return;
    }

    game.gold-=40;
    game.food+=20;
}

   DUNGEONS
============================================================ */

function enterDungeon(d){
    if(!d.discovered){
        d.discovered=true;
        game.discoveries.push(d.id);
        achievement("explorer");
        toast(`Открыто: ${d.name}`);
        game.glory+=30;
    }

    if(d.cleared){
        toast("Здесь уже всё исследовано.");
        return;
    }

    const boss=d.type==="temple";

    if(boss){
        spawnEnemy("guardian",d.x+100,d.y);
        toast("Древний Хранитель пробудился.");
    }else{
        for(let i=0;i<3;i++){
            spawnEnemy(
                d.type==="mine"?"bandit":"wraith",
                d.x+rand(-120,120),
                d.y+rand(-120,120)
            );
        }

        toast(`В ${d.name} обнаружены враги.`);
    }

    d.active=true;
}

============================================================ */

function updateWeather(dt){
    if(game.weatherTimer>0){
        game.weatherTimer-=dt;

        if(game.weatherTimer<=0){
            game.weather="clear";
        }

        return;
    }

    if(Math.random()<dt*.0015){
        const weather=pick(["clear","rain","fog","storm"]);

        game.weather=weather;
        game.weatherTimer=rand(40,120);

        toast(
            weather==="rain"?"Начался дождь.":
            weather==="fog"?"Долину окутал туман.":
            weather==="storm"?"Началась гроза.":
            "Погода прояснилась."
        );
    }
}

/* ============================================================
   TIME
============================================================ */

function updateTime(dt){
    game.time+=dt*2.1;

    if(game.time>=24*60){
        game.time-=24*60;
        newDay();
    }
}

function newDay(){
    game.day++;

    game.faith+=Math.floor(game.npcs.length*.4);

    const farms=countBuilding("farm");
    game.food+=farms*4;

    const consumption=Math.ceil(game.population*.55);

    game.food-=consumption;

    if(game.food<0){
        game.food=0;

        for(const npc of game.npcs){
            npc.hunger=clamp(npc.hunger+15,0,100);
            npc.mood=clamp(npc.mood-8,0,100);
        }

        game.faith=Math.max(0,game.faith-8);
    }

    if(game.day%30===1){
        game.year++;

        if(game.year>1){
            game.season=(game.season+1)%4;
        }
    }

    if(game.day>=30){
        achievement("survivor");
    }

    if(game.gold>=1000){
        achievement("rich");
    }

    if(game.faith>=1000){
        achievement("believer");
    }

    if(game.day%5===0){
        spawnEnemyNearPlayer();
    }

    saveGame();

    toast(`Наступил день ${game.day}.`);
}

/* ============================================================
   SAVE SYSTEM
============================================================ */

const SAVE_KEY="last_altar_save_v5";

function serialize(){
    return {
        version:5,
        seed:game.seed,
        game:{
            ...game,
            particles:[],
            enemies:[],
            projectiles:[],
            effects:[]
        },
        player:{...player},
        inventory:{...inventory},
        skillLevels:{...skillLevels},
        buildings:game.buildings.map(b=>({...b})),
        npcs:game.npcs.map(n=>({
            ...n,
            friendship:{...n.friendship}
        })),
        discoveries:[...game.discoveries]
    };
}

function saveGame(){
    try{
        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(serialize())
        );
    }catch(e){
        console.warn("Save failed",e);
    }
}

function loadGame(){
    try{
        const raw=localStorage.getItem(SAVE_KEY);

        if(!raw) return false;

        const data=JSON.parse(raw);

        if(!data||!data.game) return false;

        Object.assign(game,data.game);
        Object.assign(player,data.player||{});
        
        for(const k in inventory){
            delete inventory[k];
        }

        Object.assign(inventory,data.inventory||{});

        game.buildings=data.buildings||[];
        game.npcs=data.npcs||[];
        game.discoveries=data.discoveries||[];

        game.particles=[];
        game.enemies=[];
        game.projectiles=[];
        game.effects=[];

        updateCapacity();

        toast("Сохранение загружено.");

        return true;
    }catch(e){
        console.warn("Load failed",e);
        return false;
    }
}

function deleteSave(){
    localStorage.removeItem(SAVE_KEY);
    location.reload();
}

/* ============================================================
   CAMERA
============================================================ */

function updateCamera(dt){
    game.camera.x=lerp(game.camera.x,player.x,1-Math.pow(.001,dt));
    game.camera.y=lerp(game.camera.y,player.y,1-Math.pow(.001,dt));

    const targetZoom=
        innerWidth<800
        ?1.0
        :1.15;

    game.camera.zoom=lerp(
        game.camera.zoom,
        targetZoom,
        dt*2
    );
}

function screenToWorld(sx,sy){
    return {
        x:(sx-W/2)/game.camera.zoom+game.camera.x,
        y:(sy-H/2)/game.camera.zoom+game.camera.y
    };
}

function worldToScreen(x,y){
    return {
        x:(x-game.camera.x)*game.camera.zoom+W/2,
        y:(y-game.camera.y)*game.camera.zoom+H/2
    };
}

/* ============================================================
   DRAWING
============================================================ */

function draw(){
    ctx.clearRect(0,0,W,H);

    drawWorld();
    drawDungeons();
    drawBuildings();
    drawResources();
    drawNPCs();
    drawEnemies();
    drawPlayer();
    drawParticles();
    drawWeather();

    drawInteractionHint();

    updateHUD();
    drawMinimap();
}

function drawWorld(){
    const z=game.camera.zoom;

    const left=game.camera.x-W/(2*z)-120;
    const top=game.camera.y-H/(2*z)-120;
    const right=game.camera.x+W/(2*z)+120;
    const bottom=game.camera.y+H/(2*z)+120;

    const tile=80;

    for(let y=Math.floor(top/tile)*tile;y<bottom;y+=tile){
        for(let x=Math.floor(left/tile)*tile;x<right;x+=tile){

            let sx=(x-game.camera.x)*z+W/2;
            let sy=(y-game.camera.y)*z+H/2;

            const biome=BIOMES[biomeAt(x+40,y+40)];

            ctx.fillStyle=biome.ground;
            ctx.fillRect(sx,sy,tile*z+1,tile*z+1);

            const n=worldNoise(x,y);

            if(n>.62){
                ctx.fillStyle=biome.ground2;
                ctx.globalAlpha=.28;
                ctx.fillRect(sx,sy,tile*z+1,tile*z+1);
                ctx.globalAlpha=1;
            }

            if(waterAt(x+40,y+40)){
                ctx.fillStyle="#365e76";
                ctx.fillRect(sx,sy,tile*z+1,tile*z+1);

                ctx.strokeStyle="rgba(170,210,230,.18)";
                ctx.beginPath();

                for(let i=0;i<3;i++){
                    ctx.moveTo(sx+10*z,sy+(20+i*17)*z);
                    ctx.lineTo(sx+65*z,sy+(20+i*17)*z);
                }

                ctx.stroke();
            }
        }
    }

    /* roads */
    ctx.save();
    ctx.globalAlpha=.55;
    ctx.strokeStyle="#786b54";
    ctx.lineWidth=32*z;
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.moveTo(settlement.x,settlement.y);
    ctx.lineTo(900,650);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(settlement.x,settlement.y);
    ctx.lineTo(4450,700);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(settlement.x,settlement.y);
    ctx.lineTo(800,2900);
    ctx.stroke();

    ctx.restore();

    /* settlement ground */
    const s=worldToScreen(settlement.x,settlement.y);

    ctx.save();

    const grd=ctx.createRadialGradient(
        s.x,s.y,50,
        s.x,s.y,650*z
    );

    grd.addColorStop(0,"rgba(137,118,74,.12)");
    grd.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.arc(s.x,s.y,650*z,0,TAU);
    ctx.fill();

    ctx.restore();

    /* decorations */
    for(const d of decorations){
        if(d.x<left||d.x>right||d.y<top||d.y>bottom) continue;

        const p=worldToScreen(d.x,d.y);
        drawDecoration(d,p.x,p.y,z);
    }
}

function drawDecoration(d,x,y,z){
    const s=d.size*z;

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(d.rot);

    if(d.type==="tree"){
        ctx.fillStyle="#17271b";
        ctx.beginPath();
        ctx.arc(0,-s*.55,s*.75,0,TAU);
        ctx.fill();

        ctx.fillStyle="#263c29";
        ctx.beginPath();
        ctx.arc(-s*.25,-s*.35,s*.55,0,TAU);
        ctx.arc(s*.25,-s*.35,s*.55,0,TAU);
        ctx.fill();

        ctx.fillStyle="#594735";
        ctx.fillRect(-s*.12,0,s*.24,s*.65);
    }

    if(d.type==="deadTree"){
        ctx.strokeStyle="#292725";
        ctx.lineWidth=Math.max(2,s*.18);

        ctx.beginPath();
        ctx.moveTo(0,s*.5);
        ctx.lineTo(0,-s*.65);
        ctx.moveTo(0,-s*.25);
        ctx.lineTo(-s*.45,-s*.65);
        ctx.moveTo(0,-s*.1);
        ctx.lineTo(s*.5,-s*.5);
        ctx.stroke();
    }

    if(d.type==="rock"){
        ctx.fillStyle="#656967";
        ctx.beginPath();
        ctx.moveTo(-s*.7,s*.45);
        ctx.lineTo(-s*.4,-s*.4);
        ctx.lineTo(s*.2,-s*.55);
        ctx.lineTo(s*.7,s*.1);
        ctx.lineTo(s*.45,s*.55);
        ctx.closePath();
        ctx.fill();
    }

    if(d.type==="bush"){
        ctx.fillStyle="#304733";
        ctx.beginPath();
        ctx.arc(-s*.35,0,s*.42,0,TAU);
        ctx.arc(s*.1,-s*.15,s*.5,0,TAU);
        ctx.arc(s*.45,0,s*.35,0,TAU);
        ctx.fill();
    }

    if(d.type==="grass"){
        ctx.strokeStyle="#7b8c62";
        ctx.lineWidth=1;

        for(let i=0;i<5;i++){
            ctx.beginPath();
            ctx.moveTo((i-2)*s*.18,s*.4);
            ctx.lineTo((i-2)*s*.22,-s*.2);
            ctx.stroke();
        }
    }

    ctx.restore();
}

function drawBuildings(){
    const z=game.camera.zoom;

    for(const b of game.buildings){
        const p=worldToScreen(b.x,b.y);

        if(p.x<-200||p.x>W+200||p.y<-200||p.y>H+200) continue;

        const s=b.size*z;

        ctx.save();
        ctx.translate(p.x,p.y);

        /* shadow */
        ctx.fillStyle="rgba(0,0,0,.3)";
        ctx.beginPath();
        ctx.ellipse(0,s*.35,s*.7,s*.25,0,0,TAU);
        ctx.fill();

        if(b.type==="house"){
            ctx.fillStyle="#735d48";
            ctx.fillRect(-s*.45,-s*.1,s*.9,s*.55);

            ctx.fillStyle="#49392f";
            ctx.beginPath();
            ctx.moveTo(-s*.55,-s*.1);
            ctx.lineTo(0,-s*.58);
            ctx.lineTo(s*.55,-s*.1);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle="#c6a65e";
            ctx.fillRect(-s*.08,s*.12,s*.16,s*.32);
        }

        else if(b.type==="farm"){
            ctx.fillStyle="#6e744c";
            ctx.fillRect(-s*.5,-s*.45,s,s*.9);

            ctx.strokeStyle="#9b8c58";
            ctx.lineWidth=2*z;

            for(let i=-2;i<=2;i++){
                ctx.beginPath();
                ctx.moveTo(i*s*.16,-s*.4);
                ctx.lineTo(i*s*.16,s*.4);
                ctx.stroke();
            }
        }

        else if(b.type==="temple"){
            ctx.fillStyle="#696e78";
            ctx.fillRect(-s*.48,-s*.35,s*.96,s*.7);

            ctx.fillStyle="#a28a56";
            ctx.beginPath();
            ctx.moveTo(-s*.6,-s*.35);
            ctx.lineTo(0,-s*.78);
            ctx.lineTo(s*.6,-s*.35);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle="#e4c66d";
            ctx.beginPath();
            ctx.arc(0,-s*.15,s*.13,0,TAU);
            ctx.fill();

            ctx.shadowBlur=25;
            ctx.shadowColor="#e5bd63";
            ctx.fillStyle="#e5bd63";
            ctx.beginPath();
            ctx.arc(0,-s*.15,s*.07,0,TAU);
            ctx.fill();
            ctx.shadowBlur=0;
        }

        else if(b.type==="forge"){
            ctx.fillStyle="#554943";
            ctx.fillRect(-s*.45,-s*.35,s*.9,s*.7);

            ctx.fillStyle="#9d542e";
            ctx.beginPath();
            ctx.arc(0,s*.05,s*.2,0,TAU);
            ctx.fill();
        }

        else if(b.type==="farm"){
        }

        else{
            ctx.fillStyle=
                b.type==="library"?"#53576c":
                b.type==="market"?"#806a46":
                b.type==="clinic"?"#64756c":
                b.type==="tavern"?"#6b5040":
                b.type==="altar"?"#575e69":
                b.type==="wall"?"#62625f":
                "#555c61";

            ctx.fillRect(-s*.45,-s*.35,s*.9,s*.7);

            ctx.fillStyle="#d6b96c";
            ctx.font=`bold ${Math.max(10,14*z)}px sans-serif`;
            ctx.textAlign="center";
            ctx.textBaseline="middle";
            ctx.fillText(BUILDINGS[b.type].icon,0,0);
        }

        ctx.restore();
    }
}

function drawResources(){
    const z=game.camera.zoom;

    for(const r of game.resources){
        if(r.amount<=0) continue;

        const p=worldToScreen(r.x,r.y);

        if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40) continue;

        ctx.save();
        ctx.translate(p.x,p.y);

        const pulse=1+Math.sin(performance.now()*.004+r.x)*.05;

        ctx.scale(pulse,pulse);

        if(r.type==="wood"){
            ctx.fillStyle="#664631";
            ctx.fillRect(-12*z,-6*z,24*z,12*z);

            ctx.strokeStyle="#a37a52";
            ctx.beginPath();
            ctx.arc(10*z,0,5*z,0,TAU);
            ctx.stroke();
        }

        else if(r.type==="stone"){
            ctx.fillStyle="#777b7b";
            ctx.beginPath();
            ctx.moveTo(-14*z,8*z);
            ctx.lineTo(-8*z,-11*z);
            ctx.lineTo(8*z,-14*z);
            ctx.lineTo(15*z,5*z);
            ctx.closePath();
            ctx.fill();
        }

        else if(r.type==="iron"||r.type==="coal"){
            ctx.fillStyle=r.type==="iron"?"#927b70":"#292b2c";
            ctx.beginPath();
            ctx.arc(0,0,12*z,0,TAU);
            ctx.fill();
        }

        else if(r.type==="crystal"){
            ctx.fillStyle="#9e83d4";
            ctx.shadowBlur=14;
            ctx.shadowColor="#9e83d4";

            ctx.beginPath();
            ctx.moveTo(0,-15*z);
            ctx.lineTo(10*z,0);
            ctx.lineTo(0,15*z);
            ctx.lineTo(-10*z,0);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur=0;
        }

        else if(r.type==="herb"){
            ctx.strokeStyle="#8bb271";
            ctx.lineWidth=3*z;

            for(let i=-1;i<=1;i++){
                ctx.beginPath();
                ctx.moveTo(i*5*z,7*z);
                ctx.lineTo(i*8*z,-9*z);
                ctx.stroke();
            }
        }

        else if(r.type==="wheat"){
            ctx.strokeStyle="#c5ae59";
            ctx.lineWidth=2*z;

            for(let i=-2;i<=2;i++){
                ctx.beginPath();
                ctx.moveTo(i*4*z,9*z);
                ctx.lineTo(i*5*z,-9*z);
                ctx.stroke();
            }
        }

        else if(r.type==="fish"){
            ctx.fillStyle="#9eb7b5";
            ctx.beginPath();
            ctx.ellipse(0,0,12*z,7*z,0,0,TAU);
            ctx.moveTo(-10*z,0);
            ctx.lineTo(-19*z,-7*z);
            ctx.lineTo(-19*z,7*z);
            ctx.closePath();
            ctx.fill();
        }

        ctx.restore();
    }
}

function drawDungeons(){
    const z=game.camera.zoom;

    for(const d of game.dungeons){
        if(!d.discovered) continue;

        const p=worldToScreen(d.x,d.y);

        ctx.save();
        ctx.translate(p.x,p.y);

        const pulse=1+Math.sin(performance.now()*.003+d.x)*.1;

        ctx.scale(pulse,pulse);

        ctx.shadowBlur=20;
        ctx.shadowColor=d.cleared?"#6d8d73":"#b17a69";

        ctx.fillStyle=d.cleared?"#65756a":"#8d6257";

        ctx.beginPath();
        ctx.arc(0,0,25*z,0,TAU);
        ctx.fill();

        ctx.shadowBlur=0;

        ctx.fillStyle="#ddd0ae";
        ctx.font=`bold ${11*z}px sans-serif`;
        ctx.textAlign="center";
        ctx.fillText(d.name,0,42*z);

        ctx.restore();
    }
}

function drawNPCs(){
    const z=game.camera.zoom;

    for(const npc of game.npcs){
        const p=worldToScreen(npc.x,npc.y);

        if(p.x<-50||p.x>W+50||p.y<-50||p.y>H+50) continue;

        ctx.save();
        ctx.translate(p.x,p.y);

        /* shadow */
        ctx.fillStyle="rgba(0,0,0,.3)";
        ctx.beginPath();
        ctx.ellipse(0,13*z,10*z,5*z,0,0,TAU);
        ctx.fill();

        /* body */
        ctx.fillStyle=npc.color;
        ctx.beginPath();
        ctx.arc(0,0,11*z,0,TAU);
        ctx.fill();

        /* head */
        ctx.fillStyle="#c79b76";
        ctx.beginPath();
        ctx.arc(0,-11*z,7*z,0,TAU);
        ctx.fill();

        /* clothes */
        ctx.strokeStyle="#25282d";
        ctx.lineWidth=2*z;
        ctx.beginPath();
        ctx.moveTo(-7*z,3*z);
        ctx.lineTo(7*z,3*z);
        ctx.stroke();

        /* faith indicator */
        if(npc.faith>70){
            ctx.fillStyle="#b99cff";
            ctx.beginPath();
            ctx.arc(0,-24*z,2*z,0,TAU);
            ctx.fill();
        }

        ctx.fillStyle="rgba(255,255,255,.8)";
        ctx.font=`${Math.max(8,9*z)}px sans-serif`;
        ctx.textAlign="center";
        ctx.fillText(npc.name,0,27*z);

        ctx.restore();
    }
}

function drawEnemies(){
    const z=game.camera.zoom;

    for(const e of game.enemies){
        const p=worldToScreen(e.x,e.y);

        if(p.x<-70||p.x>W+70||p.y<-70||p.y>H+70) continue;

        const def=ENEMIES[e.type];

        ctx.save();
        ctx.translate(p.x,p.y);

        ctx.fillStyle="rgba(0,0,0,.35)";
        ctx.beginPath();
        ctx.ellipse(0,def.radius*.7*z,
                     def.radius*z*.8,
                     def.radius*z*.3,
                     0,0,TAU);
        ctx.fill();

        ctx.fillStyle=
            e.type==="wolf"?"#62615d":
            e.type==="bandit"?"#634d46":
            e.type==="guardian"?"#77727c":
            "#433d57";

        ctx.beginPath();
        ctx.arc(0,0,def.radius*z,0,TAU);
        ctx.fill();

        if(e.type==="wolf"){
            ctx.fillStyle="#302c2b";

            ctx.beginPath();
            ctx.moveTo(-9*z,-10*z);
            ctx.lineTo(-5*z,-20*z);
            ctx.lineTo(0,-10*z);
            ctx.moveTo(9*z,-10*z);
            ctx.lineTo(5*z,-20*z);
            ctx.lineTo(0,-10*z);
            ctx.fill();
        }

        if(e.type==="guardian"){
            ctx.strokeStyle="#c3a35c";
            ctx.lineWidth=3*z;
            ctx.beginPath();
            ctx.arc(0,0,def.radius*z*.65,0,TAU);
            ctx.stroke();
        }

        ctx.fillStyle="#e36b61";
        ctx.beginPath();
        ctx.arc(-5*z,-3*z,2*z,0,TAU);
        ctx.arc(5*z,-3*z,2*z,0,TAU);
        ctx.fill();

        /* hp */
        ctx.fillStyle="#16191d";
        ctx.fillRect(-22*z,-def.radius*z-10*z,44*z,4*z);

        ctx.fillStyle="#c75d59";
        ctx.fillRect(
            -22*z,
            -def.radius*z-10*z,
            44*z*(e.hp/e.maxHp),
            4*z
        );

        ctx.restore();
    }
}

function drawPlayer(){
    const z=game.camera.zoom;
    const p=worldToScreen(player.x,player.y);

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(player.facing);

    ctx.fillStyle="rgba(0,0,0,.4)";
    ctx.beginPath();
    ctx.ellipse(0,17*z,14*z,6*z,0,0,TAU);
    ctx.fill();

    /* aura */
    ctx.globalAlpha=.13;
    ctx.fillStyle="#9c83ff";
    ctx.beginPath();
    ctx.arc(0,0,26*z,0,TAU);
    ctx.fill();
    ctx.globalAlpha=1;

    /* body */
    ctx.fillStyle="#242934";
    ctx.beginPath();
    ctx.arc(0,3*z,13*z,0,TAU);
    ctx.fill();

    /* head */
    ctx.fillStyle="#d0a37f";
    ctx.beginPath();
    ctx.arc(0,-12*z,9*z,0,TAU);
    ctx.fill();

    /* horns */
    ctx.fillStyle="#ddd4bd";

    ctx.beginPath();
    ctx.moveTo(-7*z,-17*z);
    ctx.quadraticCurveTo(-17*z,-30*z,-8*z,-28*z);
    ctx.lineTo(-2*z,-18*z);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(7*z,-17*z);
    ctx.quadraticCurveTo(17*z,-30*z,8*z,-28*z);
    ctx.lineTo(2*z,-18*z);
    ctx.closePath();
    ctx.fill();

    /* eyes */
    ctx.fillStyle="#f0d16d";
    ctx.beginPath();
    ctx.arc(-3*z,-13*z,1.7*z,0,TAU);
    ctx.arc(3*z,-13*z,1.7*z,0,TAU);
    ctx.fill();

    if(player.attackTimer>0){
        ctx.strokeStyle="#e7d08a";
        ctx.lineWidth=4*z;
        ctx.beginPath();
        ctx.arc(0,0,42*z,-1.1,1.1);
        ctx.stroke();
    }

    ctx.restore();
}

function drawParticles(){
    const z=game.camera.zoom;

    for(const p of game.particles){
        const s=worldToScreen(p.x,p.y);

        const alpha=clamp(p.life/p.maxLife,0,1);

        ctx.save();
        ctx.globalAlpha=alpha;

        if(p.type==="text"){
            ctx.fillStyle="#f2e0a4";
            ctx.font=`bold ${12*z}px sans-serif`;
            ctx.textAlign="center";
            ctx.fillText(p.text,s.x,s.y);
        }else{
            ctx.fillStyle=
                p.type==="holy"?"#e6d28c":
                p.type==="dark"?"#7d5c9d":
                p.type==="rain"?"#7fa9c5":
                p.type==="hit"?"#d8a76b":
                "#b5b27e";

            ctx.beginPath();
            ctx.arc(s.x,s.y,p.size*z,0,TAU);
            ctx.fill();
        }

        ctx.restore();
    }
}

function drawWeather(){
    if(game.weather==="clear") return;

    if(game.weather==="rain"||game.weather==="storm"){
        ctx.save();
        ctx.globalAlpha=.25;

        ctx.strokeStyle="#8fa7b9";
        ctx.lineWidth=1;

        for(let i=0;i<120;i++){
            const x=(i*83+performance.now()*.15)%W;
            const y=(i*47+performance.now()*.55)%H;

            ctx.beginPath();
            ctx.moveTo(x,y);
            ctx.lineTo(x-5,y+15);
            ctx.stroke();
        }

        ctx.restore();
    }

    if(game.weather==="fog"){
        ctx.fillStyle="rgba(180,190,180,.08)";
        ctx.fillRect(0,0,W,H);
    }

    if(game.weather==="eclipse"){
        ctx.fillStyle="rgba(15,5,25,.45)";
        ctx.fillRect(0,0,W,H);

        ctx.save();
        ctx.fillStyle="#c5b3d5";
        ctx.shadowBlur=35;
        ctx.shadowColor="#7d6794";
        ctx.beginPath();
        ctx.arc(W*.8,H*.18,40,0,TAU);
        ctx.fill();
        ctx.restore();
    }

    /* night */
    const hour=game.time/60;

    if(hour<6 || hour>19){
        let alpha=.42;

        if(hour>=18 && hour<20){
            alpha=.2+(hour-18)*.22;
        }

        if(hour>=5 && hour<7){
            alpha=.42-(hour-5)*.2;
        }

        ctx.fillStyle=`rgba(10,14,35,${clamp(alpha,0,.48)})`;
        ctx.fillRect(0,0,W,H);
    }
}

}

function lightning(x,y){
    const p=worldToScreen(x,y);

    ctx.save();

    ctx.strokeStyle="#e8dc9e";
    ctx.lineWidth=4;
    ctx.shadowBlur=25;
    ctx.shadowColor="#e8dc9e";

    ctx.beginPath();

    let px=p.x;
    let py=0;

    ctx.moveTo(px,py);

    for(let i=0;i<8;i++){
        px+=rand(-25,25);
        py+=H/8;
        ctx.lineTo(px,py);
    }

    ctx.stroke();

    ctx.restore();

    burst(x,y,"holy",35);
}

function drawMinimap(){
    const w=mini.width;
    const h=mini.height;

    mctx.clearRect(0,0,w,h);

    const sx=w/WORLD.width;
    const sy=h/WORLD.height;

    const step=100;

    for(let y=0;y<WORLD.height;y+=step){
        for(let x=0;x<WORLD.width;x+=step){
            const b=BIOMES[biomeAt(x,y)];

            mctx.fillStyle=b.ground;
            mctx.fillRect(
                x*sx,
                y*sy,
                step*sx+1,
                step*sy+1
            );
        }
    }

    mctx.fillStyle="#c0a76a";
    mctx.beginPath();
    mctx.arc(
        settlement.x*sx,
        settlement.y*sy,
        7,
        0,
        TAU
    );
    mctx.fill();

    mctx.fillStyle="#fff";
    mctx.beginPath();
    mctx.arc(
        player.x*sx,
        player.y*sy,
        4,
        0,
        TAU
    );
    mctx.fill();

    mctx.strokeStyle="rgba(255,255,255,.35)";
    mctx.strokeRect(
        (game.camera.x-W/(2*game.camera.zoom))*sx,
        (game.camera.y-H/(2*game.camera.zoom))*sy,
        (W/game.camera.zoom)*sx,
        (H/game.camera.zoom)*sy
    );
}

function showDialog(name,text,options){
    document.getElementById("dialogName").textContent=name;

    box.innerHTML="";

    for(const option of options){
        const b=document.createElement("button");

        b.onclick=option.action;
        box.appendChild(b);

    document.getElementById("dialog").classList.add("show");

};

canvas.addEventListener("mousemove",e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;
});

canvas.addEventListener("mousedown",e=>{
    mouse.down=true;

    if(game.buildMode){
        const p=screenToWorld(e.clientX,e.clientY);

        if(placeBuilding(game.selectedBuild,p.x,p.y)){
            game.buildMode=false;
            game.selectedBuild=null;
        }

        return;
    }

    if(e.button===0){
        playerAttack();
    }
});

    mouse.down=false;
});

canvas.addEventListener("contextmenu",e=>{
    e.preventDefault();

    if(game.buildMode){
        game.buildMode=false;
        game.selectedBuild=null;
        toast("Строительство отменено.");
    }
});

   KEYBOARD
============================================================ */

const keys={};

addEventListener("keydown",e=>{
    keys[e.code]=true;

    if(
        ["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"]
        .includes(e.code)
    ){
        e.preventDefault();
    }

    if(e.code==="KeyE") interact();
    if(e.code==="Space") playerAttack();
    if(e.code==="KeyQ") useAbility("blessing");
    if(e.code==="KeyR") useAbility("wrath");
    if(e.code==="KeyB") openPanel("build");
    if(e.code==="KeyI") openPanel("inventory");
    if(e.code==="KeyM") openPanel("world");
    if(e.code==="Escape"){
        closePanel();
        closeDialog();
        hideModal();

        game.buildMode=false;
        game.selectedBuild=null;
    }
});

addEventListener("keyup",e=>{
    keys[e.code]=false;
});

    x:0,
    y:0
};

const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");

function joystickMove(clientX,clientY){
    const r=joy.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=clientX-cx;
    let dy=clientY-cy;

    const max=42;
    const d=Math.hypot(dx,dy);

    if(d>max){
        dx=dx/d*max;
        dy=dy/d*max;
    }

    joystick.x=dx/max;
    joystick.y=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

joy.addEventListener("touchstart",e=>{
    joystick.active=true;

    const t=e.touches[0];
    joystickMove(t.clientX,t.clientY);
},{
    passive:true
});

joy.addEventListener("touchmove",e=>{
    const t=e.touches[0];
    joystickMove(t.clientX,t.clientY);
},{
    passive:true
});

joy.addEventListener("touchend",()=>{
    joystick.active=false;
    joystick.x=0;
    joystick.y=0;
    stick.style.transform="";
});

/* ============================================================
   PLAYER MOVEMENT
============================================================ */

function updatePlayer(dt){
    let dx=0;
    let dy=0;

    if(keys.KeyW||keys.ArrowUp) dy-=1;
    if(keys.KeyS||keys.ArrowDown) dy+=1;
    if(keys.KeyA||keys.ArrowLeft) dx-=1;
    if(keys.KeyD||keys.ArrowRight) dx+=1;

    if(joystick.active){
        dx+=joystick.x;
        dy+=joystick.y;
    }

    const len=Math.hypot(dx,dy);

    if(len>1){
        dx/=len;
        dy/=len;
    }

    let speed=player.speed;

    const sprint=
        (keys.ShiftLeft||keys.ShiftRight) &&
        player.stamina>0 &&
        len>0;

    if(sprint){
        speed*=1.55;
        player.stamina-=35*dt;
    }else{
        player.stamina+=25*dt;
    }

    player.stamina=clamp(
        player.stamina,
        0,
        player.maxStamina
    );

    player.x+=dx*speed*dt;
    player.y+=dy*speed*dt;

    player.x=clamp(player.x,30,WORLD.width-30);
    player.y=clamp(player.y,30,WORLD.height-30);

    if(len>.1){
        player.facing=Math.atan2(dy,dx);
    }

    if(player.attackCooldown>0){
        player.attackCooldown-=dt;
    }

    if(player.attackTimer>0){
        player.attackTimer-=dt;
    }

    if(player.invincible>0){
        player.invincible-=dt;
    }
}

/* ============================================================
   RESOURCE RESPawn
============================================================ */

function updateResources(dt){
    for(const r of game.resources){
        if(r.amount<=0){
            r.respawn-=dt;

            if(r.respawn<=0){
                r.amount=r.max;
            }
        }
    }
}

/* ============================================================
   PARTICLE UPDATE
============================================================ */

function updateParticles(dt){
    for(let i=game.particles.length-1;i>=0;i--){
        const p=game.particles[i];

        p.life-=dt;

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.vy+=p.gravity*dt;

        if(p.life<=0){
            game.particles.splice(i,1);
        }
    }
}

/* ============================================================
   DYNAMIC EVENTS
============================================================ */

function updateEvents(dt){
    game.eventTimer-=dt;

    if(game.eventTimer<=0){
        game.eventTimer=rand(90,180);

        if(Math.random()<.6){
            randomEvent();
        }

        if(Math.random()<.3){
            spawnEnemyNearPlayer();
        }
    }
}

/* ============================================================
   ECONOMY
============================================================ */

function updateEconomy(dt){
    if(Math.random()<dt*.0005){
        const ids=Object.keys(marketPrices);
        const id=pick(ids);

        marketPrices[id]=clamp(
            marketPrices[id]+randi(-2,3),
            2,
            60
        );
    }

    if(game.day%7===0 && game.gold>=1000){
        achievement("rich");
    }
}

/* ============================================================
   WORLD NPC EVENTS
============================================================ */

function updateNPCEvents(dt){
    if(Math.random()<dt*.001){
        const npc=pick(game.npcs);

        if(!npc) return;

        const roll=Math.random();

        if(roll<.33){
            npc.mood=clamp(npc.mood+12,0,100);
            toast(`${npc.name} помог другому жителю.`);
        }else if(roll<.66){
            npc.mood=clamp(npc.mood-10,0,100);
            npc.stress=clamp(npc.stress+8,0,100);
            toast(`${npc.name} поссорился с кем-то.`);
        }else{
            npc.faith=clamp(npc.faith+8,0,100);
            toast(`${npc.name} молился в храме.`);
        }
    }
}

/* ============================================================
   ENDINGS
============================================================ */

function getEnding(){
    if(game.mercy>game.wrath*1.5 &&
       game.mercy>game.mystery){
        return "Путь Милосердия";
    }

    if(game.wrath>game.mercy*1.5 &&
       game.wrath>game.mystery){
        return "Путь Гнева";
    }

    if(game.mystery>game.mercy*1.5 &&
       game.mystery>game.wrath){
        return "Путь Тайны";
    }

    if(game.favor<0){
        return "Падение";
    }

    return "Последний Алтарь";
}

/* ============================================================
   GAME LOOP
============================================================ */

let lastTime=performance.now();

function update(dt){
    if(game.paused) return;

    updatePlayer(dt);
    updateCamera(dt);
    updateTime(dt);
    updateWeather(dt);
    updateResources(dt);
    updateParticles(dt);
    enemyAI(dt);
    npcAI(dt);
    updateEvents(dt);
    updateEconomy(dt);
    updateNPCEvents(dt);
    updateQuest();

    if(game.npcs.length<game.capacity &&
       game.day>3 &&
       Math.random()<dt*.0007){

        const npc=createNPC(
            settlement.x+rand(-300,300),
            settlement.y+rand(-250,250)
        );

        toast(`${npc.name} присоединился к поселению.`);
    }
}

function loop(now){
    const dt=Math.min(.05,(now-lastTime)/1000);
    lastTime=now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

   INITIALIZATION
============================================================ */

    generateResources();
    generateDecorations();
    generateDungeons();
    spawnInitialNPCs();

    /* Initial buildings */
    placeInitialBuilding("temple",2600,1800);
    placeInitialBuilding("house",2400,1710);
    placeInitialBuilding("house",2800,1710);
    placeInitialBuilding("farm",2420,1980);
    placeInitialBuilding("farm",2800,1980);
    placeInitialBuilding("warehouse",2600,2040);

    updateCapacity();

    if(!loadGame()){
        game.activeQuest="firstFaith";
    }

    setTimeout(()=>{
        document.getElementById("loading").style.display="none";

        toast("Мир создан.");
        toast("Исследуй долину и построй своё первое божество.");
    },700);

    requestAnimationFrame(loop);
}

function placeInitialBuilding(type,x,y){

        id:uid("building"),
        type,
        x,
        y,
        hp:100,
        level:1,
        progress:1
    });

}

initialize();

   AUTO SAVE
============================================================ */

},30000);

/* ============================================================
   ADDITIONAL WORLD INTERACTION
============================================================ */

canvas.addEventListener("dblclick",e=>{

});

/* ============================================================
   RESOURCE LIMITS
============================================================ */

function applyStorageLimit(){
    let storage=500;

    for(const b of game.buildings){
        if(b.type==="warehouse"){
            storage+=BUILDINGS.warehouse.storage;
        }
    }

    game.wood=Math.min(game.wood,storage);
    game.stone=Math.min(game.stone,storage);
    game.iron=Math.min(game.iron,storage);
    game.coal=Math.min(game.coal,storage);
    game.herb=Math.min(game.herb,storage);
    game.food=Math.min(game.food,storage);
}

setInterval(applyStorageLimit,5000);

/* ============================================================
   SEASONAL PRODUCTION
============================================================ */

setInterval(()=>{
    const season=game.season;

    for(const b of game.buildings){
        if(b.type==="farm"){
            let bonus=1;

            if(season===1) bonus=2;
            if(season===3) bonus=.5;

            game.wheat+=Math.floor(3*bonus);
            game.food+=Math.floor(3*bonus);
        }

        if(b.type==="library"){
            game.knowledge+=3;
        }

        if(b.type==="temple"){
            game.faith+=5;
        }
    }
},15000);

/* ============================================================
   NPC FAMILY / RELATIONSHIP SIMULATION
============================================================ */

setInterval(()=>{
    if(game.npcs.length<2) return;

    const a=pick(game.npcs);
    const b=pick(game.npcs);

    if(a===b) return;

    a.friendship[b.id]=(a.friendship[b.id]||0)+randi(-1,3);
    b.friendship[a.id]=(b.friendship[a.id]||0)+randi(-1,3);

    a.friendship[b.id]=clamp(a.friendship[b.id],-50,100);
    b.friendship[a.id]=clamp(b.friendship[a.id],-50,100);

    if(
        a.friendship[b.id]>70 &&
        b.friendship[a.id]>70 &&
        Math.random()<.08
    ){
        toast(`${a.name} и ${b.name} стали близкими друзьями.`);
        a.mood=clamp(a.mood+8,0,100);
        b.mood=clamp(b.mood+8,0,100);
    }

},12000);

/* ============================================================
   RANDOM WORLD DISCOVERY
============================================================ */

setInterval(()=>{
    const nearest=game.dungeons
        .filter(d=>!d.discovered)
        .sort((a,b)=>
            dist(player.x,player.y,a.x,a.y)-
            dist(player.x,player.y,b.x,b.y)
        )[0];

    if(nearest){
        const d=dist(
            player.x,
            player.y,
            nearest.x,
            nearest.y
        );

        if(d<400){
            toast(`Ты чувствуешь что-то древнее неподалёку.`);
        }
    }
},18000);

/* ============================================================
   SECRET SYSTEM
============================================================ */

const secrets=[
    {
        x:1320,
        y:1180,
        title:"Камень без тени",
        reward:()=>{
            game.mystery+=15;
            game.crystal++;
            game.knowledge+=30;
        }
    },
    {
        x:3810,
        y:2180,
        title:"Сломанная статуя",
        reward:()=>{
            game.glory+=30;
            game.faith+=30;
        }
    },
    {
        x:1850,
        y:2940,
        title:"Скрытый колодец",
        reward:()=>{
            game.food+=100;
            game.herb+=15;
        }
    }
];

const discoveredSecrets=new Set();

function updateSecrets(){
    for(const s of secrets){
        if(discoveredSecrets.has(s.title)) continue;

        if(dist(player.x,player.y,s.x,s.y)<70){
            discoveredSecrets.add(s.title);

            s.reward();

            game.discoveries.push("secret_"+s.title);

            toast(`Секрет найден: ${s.title}`);

            burst(s.x,s.y,"holy",40);

            achievement("explorer");
        }
    }
}

setInterval(updateSecrets,500);

/* ============================================================
   FAITH DYNAMICS
============================================================ */

setInterval(()=>{
    let avg=0;

    for(const npc of game.npcs){
        avg+=npc.faith;
    }

    if(game.npcs.length){
        avg/=game.npcs.length;

        if(avg>70){
            game.faith+=Math.floor(game.npcs.length*.7);
            game.favor+=1;
        }else if(avg<25){
            game.faith=Math.max(0,game.faith-4);
            game.favor-=1;
        }
    }

    if(game.favor<0){
        game.mystery+=1;
    }

},10000);

/* ============================================================
   DEFENSE
============================================================ */

function settlementDefense(){
    const walls=countBuilding("wall");
    const gates=countBuilding("gate");

    const defense=walls*3+gates*6+countBuilding("temple")*20;

    return defense;
}

setInterval(()=>{
    if(game.enemies.length===0) return;

    for(const enemy of game.enemies){
        if(
            dist(
                enemy.x,
                enemy.y,
                settlement.x,
                settlement.y
            )<settlement.radius
        ){
            const defense=settlementDefense();

            if(defense>enemy.maxHp*.3){
                enemy.hp-=Math.max(1,defense*.01);

                if(enemy.hp<=0){
                    killEnemy(enemy);
                }
            }
        }
    }
},1000);

/* ============================================================
   WORLD BORDERS / COLLISION
============================================================ */

function collisionCorrection(){
    const margin=25;

    player.x=clamp(
        player.x,
        margin,
        WORLD.width-margin
    );

    player.y=clamp(
        player.y,
        margin,
        WORLD.height-margin
    );

    if(waterAt(player.x,player.y)){
        /* push player back toward settlement */
        const dx=settlement.x-player.x;
        const dy=settlement.y-player.y;
        const d=Math.hypot(dx,dy)||1;

        player.x+=dx/d*15;
        player.y+=dy/d*15;
    }
}

setInterval(collisionCorrection,100);

/* ============================================================
   BUILDING PRODUCTION
============================================================ */

setInterval(()=>{
    for(const b of game.buildings){

        if(b.type==="workshop"){
            if(game.wood>=5){
                game.wood-=5;
                game.iron+=1;
            }
        }

        if(b.type==="forge"){
            if(game.coal>=1 && game.iron>=2){
                game.coal-=1;
                game.iron-=2;
                addItem("ironSword",1);
            }
        }

        if(b.type==="kitchen"){
            if(game.wheat>=3){
                game.wheat-=3;
                addItem("bread",2);
                game.food+=10;
            }
        }

        if(b.type==="clinic"){
            if(game.herb>=2){
                game.herb-=2;
                addItem("potion",1);
            }
        }
    }
},20000);

/* ============================================================
   Faction dynamics
============================================================ */

setInterval(()=>{
    if(game.factionRep.kingdom>50){
        marketPrices.iron=Math.max(4,marketPrices.iron-1);
        game.gold+=3;
    }

    if(game.factionRep.forest>50){
        game.herb+=2;
        game.wood+=3;
    }

    if(game.factionRep.traders>50){
        game.gold+=5;
    }

    if(game.factionRep.hermits>50){
        game.knowledge+=4;
        game.mystery+=1;
    }

    if(game.factionRep.ash<-50){
        if(Math.random()<.15){
            spawnEnemyNearPlayer();
            toast("Пепельный орден отправил разведчиков.");
        }
    }
},20000);

/* ============================================================
   STORY CONDITIONS
============================================================ */

setInterval(()=>{
    if(
        game.chapter>=3 &&
        !game.storyFlags.royalContact &&
        game.factionRep.kingdom>=20
    ){
        game.storyFlags.royalContact=true;

        showDialog(
            "Королевский посланник",

            [
                {
                    text:"Принять союз",
                    action:()=>{
                        game.factionRep.kingdom+=30;
                        game.gold+=150;
                        game.glory+=20;
                        closeDialog();
                    }
                },
                {
                    text:"Остаться независимыми",
                    action:()=>{
                        game.mystery+=8;
                        closeDialog();
                    }
                }
            ]
        );
    }
},5000);

/* ============================================================
   GAME STATE CHECK
============================================================ */

setInterval(()=>{
    if(game.faith>2000 && game.chapter<10){
        game.chapter++;
        storyChapter();
    }

    if(
        game.chapter>=10 &&
        game.storyFlags.guardianDefeated &&
        !game.storyFlags.finalChoice
    ){
        game.storyFlags.finalChoice=true;

        showDialog(
            "Последний Алтарь",
            "Теперь перед тобой последний выбор. Какой след ты оставишь в этом мире?",

                {
                    text:"Стать защитником",

                        game.mercy+=100;
                        closeDialog();
                        endingScreen("Милосердный хранитель");
                    }

                    action:()=>{
                        game.wrath+=100;
                        closeDialog();
                        endingScreen("Бог гнева");
                    }
                },
                {
                    text:"Исчезнуть за гранью",
                    action:()=>{
                        game.mystery+=100;
                        closeDialog();
                        endingScreen("Бог тайны");
                    }
                },
                {
                    text:"Оставить людям свободу",
                    action:()=>{
                        game.favor+=100;
                        closeDialog();
                        endingScreen("Освободитель");
                    }
                }
            ]
        );
    }
},10000);

            <div class="card">

                <p class="small">
                    Мир изменился благодаря решениям, которые ты принимал
                    на протяжении всей игры.

                    Вера: ${Math.floor(game.faith)}

                <p class="small">
                    Милосердие: ${game.mercy}
                </p>

                    Гнев: ${game.wrath}
                </p>

                <p class="small">
                    Тайна: ${game.mystery}

   SAVE BEFORE EXIT
============================================================ */

});

/* ============================================================
   FINAL INPUT TOUCH BUILDING
============================================================ */

canvas.addEventListener("touchend",e=>{
    if(e.changedTouches.length!==1) return;

    const t=e.changedTouches[0];

    if(game.buildMode){
        const p=screenToWorld(t.clientX,t.clientY);

        if(placeBuilding(game.selectedBuild,p.x,p.y)){

            game.selectedBuild=null;

        settlement.x,
